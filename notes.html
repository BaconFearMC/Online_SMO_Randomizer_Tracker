<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Zone Notes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/SMO-ColoredGlobe.png">
  <style>
    /* Override the main stylesheet's page padding/sizing this page IS the window */
    html { height: 100%; }
    body.notes-page {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    .notes-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .notes-page-header h2 { font-size: 1.1rem; }
    #lz-content { padding: 16px; }

    /* ── Dark Side map thumbnail ──────────────────────────────────── */
    .lz-darkside-map-wrap {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      text-align: center;
    }
    .lz-darkside-map-wrap img {
      max-width: 100%;
      border-radius: 8px;
      cursor: zoom-in;
      display: block;
      margin: 0 auto;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .lz-darkside-map-wrap img:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 18px rgba(0,0,0,.55);
    }

    /* ── Fullscreen lightbox ──────────────────────────────────────── */
    #lz-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      opacity: 0;
      pointer-events: none;
      transition: background .35s ease, opacity .3s ease;
    }
    #lz-lightbox.active {
      background: rgba(0,0,0,.86);
      opacity: 1;
      pointer-events: auto;
    }
    #lz-lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 10px;
      box-shadow: 0 10px 60px rgba(0,0,0,.65);
      cursor: zoom-out;
      transform: scale(.6) rotate(-2deg);
      opacity: 0;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
    }
    #lz-lightbox.active img {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    /* Fallback so a 3rd kingdom-tab column (Shops, added alongside the
       existing Refights / Reaching Kingdoms) still wraps sanely if
       style.css's flex rules were tuned for exactly two columns. */
    .req-picker-kingdom-wrap { flex-wrap: wrap; }
    .req-picker-kingdom-col { min-width: 180px; }

    /* No scrolling: everything must fit. Refights locked to 3x2, Shops
       locked to 3x3, and every kingdom-tab cell shrunk down so the whole
       popup fits on screen without needing scroll. */
    .req-picker-popup {
      max-height: 94vh;
      overflow: hidden;
      width: min(1320px, 96vw) !important;
      max-width: 96vw !important;
    }
    #refight-grid-force-3x2.req-picker-grid--sub,
    #shop-grid-force-3x3.req-picker-grid--sub {
      grid-template-columns: repeat(3, 1fr) !important;
      grid-auto-rows: 1fr;
    }
    .req-picker-kingdom-wrap .req-picker-item {
      padding: 4px !important;
      font-size: .7rem !important;
    }
    .req-picker-kingdom-wrap .req-picker-item span {
      display: none !important;
    }

    /* Fallback in case style.css doesn't already position this relatively -
       needed so a shop's paired-kingdom icon (position:absolute) stays
       anchored to its own cell. */
    .req-picker-item { position: relative; }

    /* Refight/Shop headers: a Zone only ever has exactly one real Refight
       and one real Shop leading into it in-game, so selecting a new one
       replaces whichever was picked before (see the exclusive-select logic
       in buildPickerCell) - this hint just makes that visible in the UI
       instead of it being a silent behavior difference from every other
       (multi-select) column. */
    .req-picker-kingdom-col-hint {
      font-weight: 400;
      font-size: .78em;
      opacity: .6;
      margin-left: 4px;
    }

    /* ── Shops (Kingdom tab, "Shops" column) ─────────────────────────
       Reuses the refight-style gradient ring via --refight-c1/--refight-c2
       (set per-item in JS: [kingdom color, gold]) so a Shop reads as its
       own distinct pickable thing rather than the kingdom itself. */
    .req-picker-item--shop {
      position: relative;
      border-color: color-mix(in srgb, var(--refight-c1, #ffd700) 55%, transparent);
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--refight-c1, #ffd700) 22%, transparent),
        color-mix(in srgb, var(--refight-c2, #ffd700) 22%, transparent));
    }
    .req-picker-item-pair-icon {
      display: block !important;
      position: absolute !important;
      right: -6% !important;
      bottom: -6% !important;
      width: 58% !important;
      height: auto !important;
      aspect-ratio: 1 / 1 !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: none !important;
      max-height: none !important;
      flex-shrink: 0 !important;
      border-radius: 50% !important;
      border: 2px solid rgba(0,0,0,.6) !important;
      background: #1a1a22 !important;
      object-fit: contain !important;
      pointer-events: none !important;
      z-index: 2;
    }
    .zone-req-icon--shop { border-radius: 6px; }

    /* Small "🏷 what's for sale" edit button riding on a Shop cell's
       opposite corner from its paired-kingdom icon (top-left vs
       bottom-right), so both can coexist without overlapping. */
    .req-picker-item-sale-btn {
      position: absolute !important;
      top: -6px !important;
      left: -6px !important;
      width: 20px !important;
      height: 20px !important;
      min-width: 0 !important;
      min-height: 0 !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
      border-radius: 50%;
      background: rgba(20,20,26,.9);
      border: 1px solid rgba(255,215,0,.65);
      color: inherit;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
      transition: transform .15s ease, background .2s ease;
    }
    .req-picker-item-sale-btn:hover {
      background: rgba(50,50,60,.95);
      transform: scale(1.12);
    }

    /* The Kingdom-only picker and Shop "for sale" picker (openKingdomOnly
       Picker / openShopSalePicker) reuse .req-picker-popup, but their grids
       (18 Kingdoms; all 52 Captures / 21 Abilities) weren't sized for the
       no-scroll "everything must fit" layout above - let these two scroll
       instead of squeezing cells down illegibly. */
    .req-picker-popup--scroll { overflow-y: auto !important; }
    .req-picker-popup--scroll .req-picker-grid { overflow: visible; max-height: none; }

    /* Paintings column's own Shop rows (Cap/Cascade/Wooded/Seaside) - just
       reuses the zone-row/zone-reqs language already used for loading
       zones, so the two Capture/Ability "for sale" chips sit next to the
       row name exactly like requirement icons do on a normal zone. */
    .zone-req-icon--capture, .zone-req-icon--ability { border-radius: 6px; }

    /* ── Find Entries (Kingdom tab) ──────────────────────────────────
       One button + chooser that replaces the old per-cell info badges. */
    .req-picker-find-btn {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      flex: none;
      order: unset;
      margin: 0;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid rgba(140,180,255,.35);
      background: linear-gradient(135deg, rgba(110,160,255,.28), rgba(255,255,255,.05));
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }
    .req-picker-find-btn:hover {
      background: linear-gradient(135deg, rgba(110,160,255,.4), rgba(255,255,255,.1));
      border-color: rgba(140,180,255,.55);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(80,140,255,.35), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .req-picker-find-btn:active { transform: translateY(0); }

    .req-picker-reach-panel {
      flex: 1 1 100%;
      order: 99;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--border, #444);
      border-radius: 8px;
      background: rgba(0,0,0,.25);
    }
    .req-picker-reach-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .req-picker-reach-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: .8rem;
      opacity: .7;
    }
    .req-picker-reach-close:hover { opacity: 1; }
    .req-picker-reach-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .req-picker-reach-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .92rem;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--line-color, #666) 45%, var(--border, #444));
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--line-color, #666) 20%, transparent),
        color-mix(in srgb, var(--line-color, #666) 6%, transparent));
      color: inherit;
    }
    .req-picker-reach-line-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 6px;
      background: rgba(0,0,0,.35);
      padding: 3px;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--line-color, #666) 55%, transparent);
    }
    .req-picker-reach-line-icon--to { margin-left: auto; }
    .req-picker-reach-line-text { flex: 1; line-height: 1.3; }
    .req-picker-reach-line-kingdom { opacity: .7; }
    .req-picker-reach-line-arrow {
      opacity: .55;
      font-size: .85rem;
      flex-shrink: 0;
    }
    .req-picker-reach-empty {
      font-size: .8rem;
      font-style: italic;
      opacity: .75;
      padding: 4px 2px;
    }

    /* ── Find mode: the pre-existing Refight/Shop/Kingdom buttons shake
       and dim slightly to invite a click, instead of a second duplicate
       row of buttons being added above them. ─────────────────────────── */
    @keyframes req-picker-find-shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20%      { transform: translateX(-2px) rotate(-1deg); }
      40%      { transform: translateX(2px) rotate(1deg); }
      60%      { transform: translateX(-2px) rotate(-1deg); }
      80%      { transform: translateX(2px) rotate(1deg); }
    }
    .req-picker-item--find-target {
      position: relative;
      animation: req-picker-find-shake .45s ease-in-out infinite;
      filter: grayscale(10%);
      cursor: pointer;
    }
    .req-picker-item--find-target::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(120,120,120,.1);
      pointer-events: none;
    }
    .req-picker-find-btn.active {
      background: linear-gradient(135deg, rgba(110,160,255,.42), rgba(110,160,255,.14));
      border-color: rgba(150,190,255,.7);
      box-shadow: 0 0 0 1px rgba(150,190,255,.5), 0 0 20px rgba(110,160,255,.4), inset 0 1px 0 rgba(255,255,255,.15);
    }

    /* ── Find results pop-up ──────────────────────────────────────────
       A real pop-up (not an inline panel) showing which zones have the
       clicked Refight/Shop/Kingdom picked as a requirement. */
    .req-find-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0);
      opacity: 0;
      pointer-events: none;
      transition: background .3s ease, opacity .25s ease;
    }
    .req-find-popup-overlay.active {
      background: rgba(0,0,0,.72);
      opacity: 1;
      pointer-events: auto;
    }
    .req-find-popup {
      width: 100%;
      max-width: 620px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--popup-color, #888) 55%, var(--border, #444));
      border-radius: 16px;
      background:
        radial-gradient(120% 100% at 50% 0%,
          color-mix(in srgb, var(--popup-color, #888) 16%, transparent),
          transparent 60%),
        var(--bg, #1a1a22);
      box-shadow:
        0 16px 60px rgba(0,0,0,.6),
        0 0 0 1px color-mix(in srgb, var(--popup-color, #888) 25%, transparent),
        0 0 40px color-mix(in srgb, var(--popup-color, #888) 24%, transparent);
      transform: scale(.92);
      opacity: 0;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .25s ease;
    }
    .req-find-popup-overlay.active .req-find-popup {
      transform: scale(1);
      opacity: 1;
    }
    .req-find-popup-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--popup-color, #888) 35%, var(--border, #444));
    }
    .req-find-popup-head-icon {
      width: 46px;
      height: 46px;
      object-fit: contain;
      flex-shrink: 0;
      padding: 6px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--popup-color, #888) 22%, rgba(0,0,0,.3));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--popup-color, #888) 55%, transparent);
    }
    .req-find-popup-head-text {
      flex: 1;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .req-find-popup-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 1rem;
      opacity: .65;
      flex-shrink: 0;
      padding: 6px;
    }
    .req-find-popup-close:hover { opacity: 1; }
    .req-find-popup-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 20px 20px;
    }

    /* ── Bigger, more visible icons in the Shop "Items For Sale" picker
       (the only place all 52 Captures / 21 Abilities show at once) ──── */
    .req-picker-popup--shop-sale .req-picker-item {
      padding: 8px !important;
    }
    .req-picker-popup--shop-sale .req-picker-item img {
      width: 68px !important;
      height: 68px !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: contain;
    }
    .req-picker-popup--shop-sale .req-picker-item span {
      font-size: .82rem !important;
      line-height: 1.2;
    }

    /* ── Notes-picker Captures tab: regular grid on the left, "One-Time
       Captures" column on the right past a divider line ─────────────── */
    .req-picker-captures-wrap {
      display: flex;
      align-items: stretch;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      gap: 0;
    }
    .req-picker-captures-wrap .req-picker-grid {
      flex: 1 1 auto;
      min-width: 0;
    }
    .req-picker-onetime-col {
      flex: 0 0 auto;
      width: 200px;
      display: flex;
      flex-direction: column;
      margin-left: 16px;
      padding-left: 16px;
      border-left: 1px solid var(--border, #444);
    }
    .req-picker-onetime-title {
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .02em;
      opacity: .85;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .req-picker-grid--onetime {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      grid-auto-rows: min-content;
      gap: 8px;
      overflow-y: auto;
      align-content: start;
      flex: 1 1 auto;
      min-height: 0;
      padding-right: 4px;
    }
    .req-picker-grid--onetime .req-picker-item {
      padding: 5px !important;
      /* grid-auto-rows: min-content means this row's height comes purely
         from its content - if the icon <img> hasn't finished loading (or
         fails to load) it contributes 0 height and the cell collapses to
         a tiny text-only pill. Force a minimum so the cell always reserves
         room for the icon regardless of image load state/timing. */
      min-height: 76px;
    }
    .req-picker-grid--onetime .req-picker-item span {
      font-size: .68rem !important;
      line-height: 1.15;
    }
    .req-picker-grid--onetime .req-picker-item img {
      /* Independent of intrinsic image size (or lack thereof pre-load/on
         error) - always a consistent square icon slot. */
      flex: 0 0 auto !important;
      width: 60% !important;
      height: auto !important;
      aspect-ratio: 1 / 1;
    }

    /* A capture/ability whose icon file genuinely 404s (see the img error
       listener in buildPickerCell): hide the broken-image glyph and show a
       plain "?" placeholder in the same reserved icon box, instead of the
       cell silently losing its icon and shrinking. */
    .req-picker-item--broken-icon img { visibility: hidden; }
    .req-picker-item--broken-icon { position: relative; }
    .req-picker-item--broken-icon::before {
      content: '?';
      position: absolute;
      top: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      opacity: .35;
      color: var(--text-dim);
    }

    /* Coin Grind is one tile that opens a tiny 3-option submenu (Snow /
       Cascade / Wooded) rather than toggling a requirement directly. */
    .req-picker-coingrind-submenu {
      position: fixed;
      z-index: 10001;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      min-width: 200px;
      border-radius: 12px;
      border: 1px solid var(--border, #444);
      background: var(--bg, #1a1a22);
      box-shadow: 0 10px 34px rgba(0,0,0,.55);
      opacity: 0;
      transform: translateY(-4px) scale(.97);
      transition: opacity .16s ease, transform .16s ease;
      pointer-events: none;
    }
    .req-picker-coingrind-submenu.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .req-picker-coingrind-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: rgba(255,255,255,.04);
      color: inherit;
      font-size: .82rem;
      text-align: left;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .req-picker-coingrind-opt:hover {
      background: rgba(255,255,255,.09);
    }
    .req-picker-coingrind-opt.selected {
      border-color: rgba(140,180,255,.6);
      background: rgba(110,160,255,.16);
    }
    .req-picker-coingrind-opt img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 5px;
      background: rgba(0,0,0,.3);
      padding: 2px;
    }
    .req-picker-coingrind-opt-sub {
      display: block;
      opacity: .6;
      font-size: .78em;
    }
    .req-picker-item--coingrind.selected {
      border-color: rgba(255,215,0,.6) !important;
    }
  </style>
</head>
<body class="notes-page">
  <div class="notes-page-header">
    <h2>Loading Zone Notes</h2>
    <div class="modal-header-actions">
      <button class="modal-icon-btn-red" id="notes-page-clear" title="Clear all notes">Clear</button>
    </div>
  </div>
  <div class="lz-scroll-wrap">
    <div id="lz-content"></div>
  </div>

  <script src="apc-data.js?v=5"></script>
  <script>
    'use strict';

    // Re-triggers the .click-bounce CSS animation on an element. Removing
    // the class first (and forcing a reflow) means rapid repeat clicks each
    // get their own fresh bounce instead of the animation silently no-op'ing
    // because the class was already present.
    function bounce(el) {
      if (!el) return;
      el.classList.remove('click-bounce');
      void el.offsetWidth;
      el.classList.add('click-bounce');
    }

    // ── Shared constants (mirrors app.js) ──────────────────────────
    const STATE_KEY = 'tracker_state';
    const MOBILE_BREAKPOINT  = 540;
    const ZONE_SPLIT_THRESHOLD = 10 ;

    const DEFAULT_SETTINGS = {
      show_moon_total:   true,
      moon_requirement:  124,
      show_icon_colors:  true,
      show_ability_lock: true,
      show_captures:     true,
      show_save_buttons: true,
      show_multi_moon:   true,
      show_kingdom_moon: false,
      overlay_scale:     1,
      notes_scroll_px:   100,
      scroll_left_binding:  { type: 'mouse', code: 3 },
      scroll_right_binding: { type: 'mouse', code: 4 },
      notes_layout:  'horizontal', // 'horizontal' | 'vertical'
      notes_columns: 2,            // vertical-mode kingdoms side-by-side (1|2|3)
      notes_compact: false,        // tighter spacing + shorter note boxes
      show_painting_notes: false,  // Paintings notes column (before Cascade); default off
      zone_names:    {},           // custom loading-zone name overrides
    };

    // Custom zone names live in settings.zone_names ({ kingdom: { zoneKey: name } }).
    // Empty/missing → default name. Shared with the tracker + map via tracker_state.
    function zoneDisplayName(kingdom, zone) {
      const byKingdom = fullState.settings.zone_names && fullState.settings.zone_names[kingdom];
      const custom = byKingdom && byKingdom[zone];
      return (custom && String(custom).trim()) ? custom : zone;
    }

    function kingdomDisplayName(key) {
      const item = APC.findItem('kingdoms', key);
      return item ? item.name : key;
    }

    // "How do I reach <Kingdom>?" (Kingdom tab -> Reaching Kingdoms) is
    // generated from the same per-zone Kingdom requirement you already pick
    // via each zone's "+" button (Kingdom tab): tag a zone with the kingdom
    // it leads to there, and it shows up here as e.g.
    // "Klepto in Lost goes to Cap".
    function buildReachLines(kingdomKey) {
      return buildRequirementLines('kingdoms', kingdomKey, ' goes to ');
    }

    // Generic reverse lookup: every zone that has {kind, key} picked as a
    // requirement (Captures/Abilities/Refights/Shops/Kingdoms), one row of
    // data each (not a flat string) so the find pop-up can render it as a
    // from-icon/label/to-icon line, tinted with the zone's own kingdom
    // color. `verb` lets Kingdoms read "goes to" while everything else
    // defaults to "needs".
    function buildRequirementLines(kind, key, verb) {
      const item = APC.findItem(kind, key);
      const targetName = item ? item.name : key;
      const targetIcon = item ? item.src : null;
      const lines = [];
      for (const [kingdom, data] of Object.entries(fullState.loading_zones)) {
        for (const [zone, zs] of Object.entries(data.zones)) {
          if (!Array.isArray(zs.requirements)) continue;
          if (zs.requirements.some(r => r.kind === kind && r.key === key)) {
            const tpl = LOADING_ZONES_TEMPLATE[kingdom] || {};
            lines.push({
              fromIcon: tpl.icon ? 'assets/' + tpl.icon : null,
              fromColor: tpl.color || null,
              fromLabel: zoneDisplayName(kingdom, zone),
              kingdomLabel: kingdomDisplayName(kingdom),
              verb: verb || ' needs ',
              toIcon: targetIcon,
              toLabel: targetName,
            });
          }
        }
      }
      return lines;
    }

    // Mirrors the map in app.js keep them in sync when adding a new
    // toggleable kingdom (see the comment next to KINGDOM_VISIBILITY_SETTINGS
    // in app.js for the full list of places to update).
    const KINGDOM_VISIBILITY_SETTINGS = {
      Moon: 'show_kingdom_moon',
    };

    // Paintings notes column (mirrors app.js): one note box per kingdom, no moons.
    const PAINTINGS_NOTES_KEY = 'Paintings';
    const PAINTING_NOTE_KINGDOMS = ['Cascade','Sand','Lake','Wooded','Metro','Snow','Seaside','Luncheon',"Bowser's",'Mushroom'];

    // Extra Shops that only live in the Paintings column (not real
    // in-loading-zone gates, so they never show up in the Kingdom tab's
    // "Shop" picker on a zone - see PAINTING_SHOP_ENTRIES/`paintingOnly` in
    // apc-data.js). Each maps a kingdom name here to its APC.SHOPS key.
    const PAINTING_SHOP_KINGDOMS = ['Cap', 'Cascade', 'Wooded', 'Seaside'];
    const PAINTING_SHOP_KEYS = {
      Cap: 'Cap_Shop', Cascade: 'Cascade_Shop', Wooded: 'Wooded_Shop', Seaside: 'Seaside_Shop',
    };

    let fullState = null;

    function buildDefaultLoadingZones() {
      const result = {};
      for (const [kingdom, data] of Object.entries(LOADING_ZONES_TEMPLATE)) {
        result[kingdom] = { color: data.color, icon: data.icon, zones: {} };
        for (const [zone, zd] of Object.entries(data.zones)) {
          // requirements: ordered list of { kind: 'captures'|'abilities', key }
          // entries picked from the Abilities & Captures list (apc-data.js).
          // Their icons render above the location; their names are copied
          // into the note text but the text stays freely editable afterward.
          result[kingdom].zones[zone] = { note:'', requirements:[], collapsed:false, num: zd.num };
        }
      }
      return result;
    }

    function loadFullState() {
      try {
        const raw = localStorage.getItem(STATE_KEY);
        fullState = raw ? JSON.parse(raw) : {};
      } catch (e) {
        fullState = {};
      }

      if (!fullState.settings) {
        fullState.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
      } else {
        for (const key of Object.keys(DEFAULT_SETTINGS)) {
          if (!(key in fullState.settings)) fullState.settings[key] = DEFAULT_SETTINGS[key];
        }
      }

      const defaults = buildDefaultLoadingZones();
      if (!fullState.loading_zones) {
        fullState.loading_zones = defaults;
      } else {
        for (const [kingdom, data] of Object.entries(defaults)) {
          if (!fullState.loading_zones[kingdom]) {
            fullState.loading_zones[kingdom] = data;
          } else {
            for (const [zone, zd] of Object.entries(data.zones)) {
              if (!fullState.loading_zones[kingdom].zones[zone]) {
                fullState.loading_zones[kingdom].zones[zone] = zd;
              }
            }
          }
        }
      }

      // Seaside no longer has separate Well Enter/Exit zones - drop them from
      // any state saved before this change.
      const seaside = fullState.loading_zones['Seaside'];
      if (seaside) {
        delete seaside.zones['Well Enter'];
        delete seaside.zones['Well Exit'];
      }

      // Deep Woods "Vines" merge (mirrors app.js applyVinesMergeSetting).
      const dw = fullState.loading_zones['Deep Woods'];
      if (dw) {
        const vineKeys = ['Vine #1 (Dino)', 'Vine #2 (Peculiar Pipes)', 'Vine #3 (Babbling Brook)', 'Vine #4 (Creek)'];
        if (fullState.settings.merge_deep_woods_vines) {
          if (!dw.zones['Vines']) {
            dw.zones['Vines'] = { note: '', requirements: [], collapsed: false, num: 0 };
          }
          vineKeys.forEach(k => delete dw.zones[k]);
        } else {
          delete dw.zones['Vines'];
        }
      }

      // Migrate any zone saved before the Captures/Abilities requirement
      // system existed: drop the old Kingdom Moon icon fields and make sure
      // every zone has a requirements array to work with.
      for (const kingdom of Object.values(fullState.loading_zones)) {
        for (const zone of Object.values(kingdom.zones)) {
          if (!Array.isArray(zone.requirements)) zone.requirements = [];
          delete zone.leadsTo;
          delete zone.icon;
          delete zone.icon2;
        }
      }

      if (!fullState.kingdom_collapsed) {
        fullState.kingdom_collapsed = Object.fromEntries(Object.keys(LOADING_ZONES_TEMPLATE).map(k => [k, false]));
      }
      if (!(PAINTINGS_NOTES_KEY in fullState.kingdom_collapsed)) {
        fullState.kingdom_collapsed[PAINTINGS_NOTES_KEY] = false;
      }
      if (!fullState.painting_notes) fullState.painting_notes = {};
      PAINTING_NOTE_KINGDOMS.forEach(k => {
        if (!(k in fullState.painting_notes)) fullState.painting_notes[k] = '';
      });
      if (!fullState.painting_destinations) fullState.painting_destinations = {};
      if (!fullState.shop_sales) fullState.shop_sales = {};

      // "How do I reach <Kingdom>?" (Kingdom tab -> Reaching Kingdoms) is
      // generated from each zone's "→ leads to" pick below, so there's no
      // separate note state to seed here anymore. Drop any leftover data
      // from the old free-text version of this feature.
      delete fullState.kingdom_reach;
    }

    function saveFullState() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify(fullState));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    // Clears the note text and the selected Captures/Abilities requirements
    // in every zone, leaving collapsed/expanded state untouched.
    function clearAllNotes() {
      if (!confirm('Clear all loading zone notes? This cannot be undone.')) return;
      for (const kingdom of Object.values(fullState.loading_zones)) {
        for (const zone of Object.values(kingdom.zones)) {
          zone.note = '';
          zone.requirements = [];
        }
      }
      if (fullState.painting_notes) {
        for (const k of Object.keys(fullState.painting_notes)) fullState.painting_notes[k] = '';
      }
      fullState.painting_destinations = {};
      fullState.shop_sales = {};
      saveFullState();
      buildLoadingZonesContent();
    }

    // ── Notes layout: orientation / column count / compact ───────────
    // Class-driven on #lz-content so switching is instant. Settings persist
    // to localStorage and are shared with the in-page modal in app.js.
    function normalizeNotesCols(v) {
      return (v === 1 || v === 3) ? v : 2;
    }

    function applyNotesLayout() {
      const content = document.getElementById('lz-content');
      if (!content) return;
      const s = fullState.settings;
      const vertical = s.notes_layout === 'vertical';
      const cols = normalizeNotesCols(s.notes_columns);
      content.classList.toggle('lz-layout-vertical', vertical);
      content.classList.toggle('lz-layout-horizontal', !vertical);
      content.classList.remove('lz-cols-1', 'lz-cols-2', 'lz-cols-3');
      content.classList.add('lz-cols-' + cols);
      content.classList.toggle('lz-compact', !!s.notes_compact);
      syncNotesToolbar();
    }

    function syncNotesToolbar() {
      const bar = document.querySelector('.lz-toolbar');
      if (!bar) return;
      const s = fullState.settings;
      const vertical = s.notes_layout === 'vertical';
      const cols = normalizeNotesCols(s.notes_columns);
      bar.classList.toggle('orient-vertical', vertical);
      bar.querySelectorAll('[data-orient]').forEach(b =>
        b.classList.toggle('active', (b.dataset.orient === 'vertical') === vertical));
      bar.querySelectorAll('[data-cols]').forEach(b =>
        b.classList.toggle('active', Number(b.dataset.cols) === cols));
      const compactBtn = bar.querySelector('[data-compact]');
      if (compactBtn) compactBtn.classList.toggle('active', !!s.notes_compact);
    }

    function autosizeNotes(root) {
      // Only measure boxes that actually have text (an empty note is already a
      // correct single row), and batch reset/read/apply into three phases so we
      // don't force a full reflow of the notes masonry on every single box.
      // Interleaving write→read→write per box is what made this view slow.
      const nodes = Array.from((root || document).querySelectorAll('.zone-note'))
        .filter(t => t.style.display !== 'none' && t.value.trim() !== '');
      if (!nodes.length) return;
      nodes.forEach(t => { t.style.height = 'auto'; });
      const heights = nodes.map(t => t.scrollHeight);
      nodes.forEach((t, i) => { t.style.height = heights[i] + 'px'; });
    }

    function ensureNotesToolbar() {
      const scrollWrap = document.querySelector('.lz-scroll-wrap');
      if (!scrollWrap || !scrollWrap.parentElement) return;
      if (document.querySelector('.lz-toolbar')) return;

      const bar = document.createElement('div');
      bar.className = 'lz-toolbar';
      bar.innerHTML =
        '<div class="lz-toolbar-group">' +
          '<span class="lz-toolbar-label">Layout</span>' +
          '<div class="segmented">' +
            '<button class="seg-btn" data-orient="horizontal">Horizontal</button>' +
            '<button class="seg-btn" data-orient="vertical">Vertical</button>' +
          '</div>' +
        '</div>' +
        '<div class="lz-toolbar-group lz-cols-group">' +
          '<span class="lz-toolbar-label">Columns</span>' +
          '<div class="segmented">' +
            '<button class="seg-btn" data-cols="1">1</button>' +
            '<button class="seg-btn" data-cols="2">2</button>' +
            '<button class="seg-btn" data-cols="3">3</button>' +
          '</div>' +
        '</div>' +
        '<div class="lz-toolbar-group">' +
          '<button class="lz-compact-btn" data-compact>Compact</button>' +
        '</div>';

      bar.querySelectorAll('[data-orient]').forEach(b =>
        b.addEventListener('click', () => {
          fullState.settings.notes_layout = b.dataset.orient;
          saveFullState();
          applyNotesLayout();
        }));
      bar.querySelectorAll('[data-cols]').forEach(b =>
        b.addEventListener('click', () => {
          fullState.settings.notes_columns = Number(b.dataset.cols);
          fullState.settings.notes_layout = 'vertical';
          saveFullState();
          applyNotesLayout();
        }));
      const compactBtn = bar.querySelector('[data-compact]');
      compactBtn.addEventListener('click', () => {
        fullState.settings.notes_compact = !fullState.settings.notes_compact;
        saveFullState();
        applyNotesLayout();
      });

      scrollWrap.parentElement.insertBefore(bar, scrollWrap);
    }

    // ── Build kingdom list ──────────────────────────────────────────
    function buildLoadingZonesContent() {
      const container = document.getElementById('lz-content');
      container.innerHTML = '';
      if (fullState.settings.show_painting_notes) {
        container.appendChild(buildPaintingNotesColumn());
      }
      for (const [kingdom, data] of Object.entries(fullState.loading_zones)) {
        const settingKey = KINGDOM_VISIBILITY_SETTINGS[kingdom];
        if (settingKey && !fullState.settings[settingKey]) continue;
        container.appendChild(buildKingdomColumn(kingdom, data));
      }
      applyNotesLayout();
      autosizeNotes(container);
    }

    // Paintings notes column: one note box per kingdom, no moon icons.
    function buildPaintingNotesColumn() {
      if (!fullState.painting_notes) fullState.painting_notes = {};
      const col = document.createElement('div');
      col.className = 'kingdom-col';

      const header = document.createElement('div');
      header.className = 'kingdom-col-header';

      const icon = document.createElement('img');
      icon.src = 'assets/Painting.png';
      icon.height = 20;
      icon.alt = 'Paintings';

      const title = document.createElement('span');
      title.className = 'col-title';
      title.textContent = 'Paintings';
      title.style.color = '#e6e6ee';

      const chevron = document.createElement('span');
      chevron.className = 'col-chevron';
      chevron.textContent = '▾';

      header.appendChild(icon);
      header.appendChild(title);
      header.appendChild(chevron);

      const zonesRoot = document.createElement('div');
      zonesRoot.className = 'zones-container';

      PAINTING_NOTE_KINGDOMS.forEach(kingdom => {
        if (!(kingdom in fullState.painting_notes)) fullState.painting_notes[kingdom] = '';
        const kd = LOADING_ZONES_TEMPLATE[kingdom] || { color: '#e6e6ee' };
        const row = document.createElement('div');
        row.className = 'zone-row';

        const top = document.createElement('div');
        top.className = 'zone-row-top';

        // A Painting only ever needs a single "which Kingdom does this lead
        // to?" pick - the + button here opens straight to that Kingdom-only
        // grid (all 18), never the full Capture/Ability/Refight/Shop picker
        // a loading zone's + button opens.
        const reqsWrap = document.createElement('div');
        reqsWrap.className = 'zone-reqs';

        function renderDestChip() {
          reqsWrap.innerHTML = '';
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'zone-req-add';
          addBtn.title = 'Pick which Kingdom this Painting leads to';
          addBtn.textContent = '+';
          addBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            bounce(addBtn);
            const current = APC.getPaintingDestination(fullState, kingdom);
            openKingdomOnlyPicker(current, (kingdomKey) => {
              APC.setPaintingDestination(fullState, kingdom, kingdomKey);
              saveFullState();
              renderDestChip();
            });
          });
          reqsWrap.appendChild(addBtn);

          const destKey = APC.getPaintingDestination(fullState, kingdom);
          if (destKey) {
            const item = APC.findItem('kingdoms', destKey);
            if (item) {
              const group = document.createElement('span');
              group.className = 'zone-req-pair';

              const img = document.createElement('img');
              img.className = 'zone-req-icon zone-req-icon--kingdom';
              img.src = item.src;
              img.alt = item.name;
              img.title = 'Leads to ' + item.name + ' (click to remove)';
              if (item.color) img.style.setProperty('--kingdom-color', item.color);

              const destLabel = document.createElement('span');
              destLabel.className = 'zone-req-dest-name';
              destLabel.textContent = item.name;
              destLabel.style.cssText = 'margin-left:4px;font-weight:600;cursor:pointer;';
              destLabel.style.color = item.color || '#e6e6ee';
              destLabel.title = 'Leads to ' + item.name + ' (click to remove)';

              const removeDest = (e) => {
                e.stopPropagation();
                bounce(img);
                APC.setPaintingDestination(fullState, kingdom, null);
                saveFullState();
                renderDestChip();
              };
              img.addEventListener('click', removeDest);
              destLabel.addEventListener('click', removeDest);

              group.appendChild(img);
              group.appendChild(destLabel);
              reqsWrap.appendChild(group);
            }
          }
        }
        renderDestChip();
        top.appendChild(reqsWrap);

        const nameLabel = document.createElement('span');
        nameLabel.className = 'zone-name';
        nameLabel.textContent = kingdom;
        nameLabel.style.color = kd.color;
        top.appendChild(nameLabel);
        row.appendChild(top);

        const noteArea = document.createElement('textarea');
        noteArea.className = 'zone-note';
        noteArea.value = fullState.painting_notes[kingdom] || '';
        noteArea.placeholder = 'Note…';
        noteArea.rows = 1;
        noteArea.addEventListener('input', () => {
          fullState.painting_notes[kingdom] = noteArea.value;
          saveFullState();
          requestAnimationFrame(() => {
            noteArea.style.height = 'auto';
            noteArea.style.height = noteArea.scrollHeight + 'px';
          });
        });
        row.appendChild(noteArea);
        zonesRoot.appendChild(row);
      });

      // Extra per-kingdom Shops that only live here in the Paintings column
      // (Cap, Cascade, Wooded, Seaside - see PAINTING_SHOP_KINGDOMS above).
      // Unlike a Painting row, a Shop row's + button skips straight to the
      // Capture-for-sale/Ability-for-sale picker - never the Kingdom grid.
      PAINTING_SHOP_KINGDOMS.forEach(kingdom => {
        zonesRoot.appendChild(buildPaintingShopRow(kingdom));
      });

      if (fullState.kingdom_collapsed[PAINTINGS_NOTES_KEY]) {
        zonesRoot.style.display = 'none';
        header.classList.add('collapsed');
      }
      header.addEventListener('click', () => {
        const willCollapse = zonesRoot.style.display !== 'none';
        zonesRoot.style.display = willCollapse ? 'none' : '';
        header.classList.toggle('collapsed', willCollapse);
        fullState.kingdom_collapsed[PAINTINGS_NOTES_KEY] = willCollapse;
        saveFullState();
      });

      col.appendChild(header);
      col.appendChild(zonesRoot);
      return col;
    }

    // One row for a Paintings-column-only Shop (Cap/Cascade/Wooded/Seaside).
    // No note box - just the shop's name and a + that opens the Capture &
    // Ability "for sale" picker directly (see openShopSalePicker).
    function buildPaintingShopRow(kingdomName) {
      const shopKey = PAINTING_SHOP_KEYS[kingdomName];
      const kd = LOADING_ZONES_TEMPLATE[kingdomName] || { color: '#ffd700' };
      const row = document.createElement('div');
      row.className = 'zone-row';

      const top = document.createElement('div');
      top.className = 'zone-row-top';

      const reqsWrap = document.createElement('div');
      reqsWrap.className = 'zone-reqs';

      function buildSaleChip(kind, key) {
        const item = APC.findItem(kind, key);
        if (!item) return null;
        const img = document.createElement('img');
        img.className = 'zone-req-icon ' + (kind === 'captures' ? 'zone-req-icon--capture' : 'zone-req-icon--ability');
        img.src = item.src;
        img.alt = item.name;
        img.title = item.name + ' - for sale (click to remove)';
        img.addEventListener('click', (e) => {
          e.stopPropagation();
          bounce(img);
          APC.setShopSale(fullState, shopKey, kind, null);
          saveFullState();
          renderChips();
        });
        return img;
      }

      function renderChips() {
        reqsWrap.innerHTML = '';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'zone-req-add';
        addBtn.title = 'Set the Capture & Ability for sale at this Shop';
        addBtn.textContent = '+';
        addBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          bounce(addBtn);
          openShopSalePicker(shopKey, renderChips);
        });
        reqsWrap.appendChild(addBtn);

        const sale = APC.getShopSale(fullState, shopKey);
        if (sale.ability) {
          const chip = buildSaleChip('abilities', sale.ability);
          if (chip) reqsWrap.appendChild(chip);
        }
        if (sale.capture) {
          const chip = buildSaleChip('captures', sale.capture);
          if (chip) reqsWrap.appendChild(chip);
        }
      }
      renderChips();
      top.appendChild(reqsWrap);

      const icon = document.createElement('img');
      icon.className = 'zone-req-icon--shop';
      icon.src = 'assets/shop.png';
      icon.alt = 'Shop';
      icon.height = 16;
      icon.style.marginRight = '4px';
      top.appendChild(icon);

      const nameLabel = document.createElement('span');
      nameLabel.className = 'zone-name';
      nameLabel.textContent = kingdomName + ' Shop';
      nameLabel.style.color = kd.color;
      top.appendChild(nameLabel);
      row.appendChild(top);

      return row;
    }

    function buildKingdomColumn(kingdom, data) {
      const col = document.createElement('div');
      col.className = 'kingdom-col';

      const header = document.createElement('div');
      header.className = 'kingdom-col-header';

      const icon = document.createElement('img');
      icon.src = `assets/${data.icon}`;
      icon.height = 20;
      icon.alt = kingdom;

      const title = document.createElement('span');
      title.className = 'col-title';
      title.textContent = kingdom;
      title.style.color = data.color;

      const chevron = document.createElement('span');
      chevron.className = 'col-chevron';
      chevron.textContent = '▾';

      header.appendChild(icon);
      header.appendChild(title);
      header.appendChild(chevron);

      const zoneEntries = Object.entries(data.zones);
      const needsSplit  = zoneEntries.length > ZONE_SPLIT_THRESHOLD;

      let zonesRoot;
      if (needsSplit) {
        const mid = Math.ceil(zoneEntries.length / 2);
        zonesRoot = document.createElement('div');
        zonesRoot.className = 'zones-split-wrap';

        const col1 = document.createElement('div');
        col1.className = 'zones-container';
        const col2 = document.createElement('div');
        col2.className = 'zones-container';

        zoneEntries.slice(0, mid).forEach(([zone, zd]) =>
          col1.appendChild(buildZoneRow(kingdom, zone, zd, data.color)));
        zoneEntries.slice(mid).forEach(([zone, zd]) =>
          col2.appendChild(buildZoneRow(kingdom, zone, zd, data.color)));

        zonesRoot.appendChild(col1);
        zonesRoot.appendChild(col2);
      } else {
        zonesRoot = document.createElement('div');
        zonesRoot.className = 'zones-container';
        zoneEntries.forEach(([zone, zd]) =>
          zonesRoot.appendChild(buildZoneRow(kingdom, zone, zd, data.color)));
      }

      // Dark Side gets a map thumbnail under its zones. It lives inside
      // zonesRoot so it collapses/expands right along with the zone notes
      // above it - "opening" the kingdom is what reveals it. Click it to
      // blow it up fullscreen; click (or Esc) to shrink it back down.
      if (kingdom === 'Darkside') {
        const mapWrap = document.createElement('div');
        mapWrap.className = 'lz-darkside-map-wrap';
        const mapImg = document.createElement('img');
        mapImg.src = 'assets/darksidemap.png';
        mapImg.alt = 'Dark Side Map';
        mapImg.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(mapImg.src, mapImg.alt);
        });
        mapWrap.appendChild(mapImg);
        zonesRoot.appendChild(mapWrap);
      }

      if (fullState.kingdom_collapsed[kingdom]) {
        zonesRoot.style.display = 'none';
        header.classList.add('collapsed');
      }

      header.addEventListener('click', () => {
        const willCollapse = zonesRoot.style.display !== 'none';
        zonesRoot.style.display = willCollapse ? 'none' : '';
        header.classList.toggle('collapsed', willCollapse);
        fullState.kingdom_collapsed[kingdom] = willCollapse;
        saveFullState();
        // layoutMasonryColumns();
      });

      col.appendChild(header);
      col.appendChild(zonesRoot);
      return col;
    }

    function buildZoneRow(kingdom, zone, zoneData, color) {
      const zs = fullState.loading_zones[kingdom].zones[zone];
      if (!Array.isArray(zs.requirements)) zs.requirements = [];
      const row = document.createElement('div');
      row.className = 'zone-row';

      const top = document.createElement('div');
      top.className = 'zone-row-top';

      const reqsWrap = document.createElement('div');
      reqsWrap.className = 'zone-reqs';

      // Note textarea is built first (but appended later) so the requirement
      // icons/picker above can read from and write into it.
      const noteArea = document.createElement('textarea');
      noteArea.className = 'zone-note';
      noteArea.value = zs.note || '';
      noteArea.placeholder = 'Note…';
      noteArea.rows = 1;
      if (zs.collapsed) noteArea.style.display = 'none';

      noteArea.addEventListener('input', () => {
        zs.note = noteArea.value;
        saveFullState();
        // Icons/coloring driven off note text (auto-detected items, Kingdom
        // tint) need to stay live while typing, but they're cheap DOM-only
        // updates to reqsWrap/noteArea - they don't touch the textarea's own
        // value or selection, so they never fight the keystroke or steal focus.
        renderReqIcons();
        // Deferred to the next frame so the height change (and the
        // scroll-container reflow it can trigger) happens after the
        // browser has finished handling this keystroke, instead of
        // racing it and kicking focus out of the box.
        requestAnimationFrame(() => {
          noteArea.style.height = 'auto';
          noteArea.style.height = noteArea.scrollHeight + 'px';
        });
      });

      // Kingdom color: a Kingdom note "colors in" the box - tint the
      // textarea with that kingdom's color. Looks first at an explicitly
      // picked Kingdom requirement, then falls back to a Kingdom name typed
      // (and auto-detected) directly in the note text.
      function currentKingdomColor() {
        const explicit = zs.requirements.find(r => r.kind === 'kingdoms');
        if (explicit) {
          const item = APC.findItem('kingdoms', explicit.key);
          if (item) return item.color;
        }
        const detected = APC.detectItemsInText(noteArea.value).find(i => i.kind === 'kingdoms');
        return detected ? detected.color : null;
      }

      function hexToRgba(hex, alpha) {
        const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
        if (!m) return null;
        const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      }

      function updateNoteColor() {
        const color = currentKingdomColor();
        if (color) {
          noteArea.style.borderColor = color;
          noteArea.style.background = hexToRgba(color, 0.14) || '';
          noteArea.style.boxShadow = '0 0 0 1px ' + (hexToRgba(color, 0.35) || 'transparent') + ' inset';
        } else {
          noteArea.style.borderColor = '';
          noteArea.style.background = '';
          noteArea.style.boxShadow = '';
        }
      }

      // Builds one clickable icon chip for an explicitly-picked requirement.
      // `onRemove`, if given, overrides what a click removes (used by
      // Refights so either half of the pair deletes the whole thing).
      // `extraClass`, if given, is added on top of the kind-based class
      // (used for the smaller "paired" icon riding next to a refight icon).
      function buildReqIconEl(kind, key, item, onRemove, extraClass, refightColors) {
        const img = document.createElement('img');
        const kindClass =
          kind === 'abilities' ? 'zone-req-icon--ability' :
          kind === 'kingdoms'  ? 'zone-req-icon--kingdom'  :
          kind === 'refights'  ? 'zone-req-icon--refight'  :
          kind === 'shops'     ? 'zone-req-icon--shop'     : 'zone-req-icon--capture';
        img.className = 'zone-req-icon ' + kindClass + (extraClass ? ' ' + extraClass : '');
        img.src = item.src;
        img.alt = item.name;
        img.title = item.name + ' (click to remove)';
        if (kind === 'kingdoms' && item.color) img.style.setProperty('--kingdom-color', item.color);
        if (refightColors) {
          img.classList.add('zone-req-icon--refight-active');
          img.style.setProperty('--refight-c1', refightColors[0]);
          img.style.setProperty('--refight-c2', refightColors[1]);
        }
        img.addEventListener('click', (e) => {
          e.stopPropagation();
          bounce(img);
          if (onRemove) {
            onRemove();
          } else {
            toggleRequirement(zs, kind, key, noteArea);
          }
          renderReqIcons();
          saveFullState();
        });
        return img;
      }

      // Fully removes a Shop requirement's "sells" sentence and the
      // underlying sale data (both halves) - used when the Shop icon itself
      // is removed, since that drops everything tied to the Shop at once.
      function clearShopSale(shopKey) {
        const sale = APC.getShopSale(fullState, shopKey);
        const saleTxt = shopSaleDisplayText(shopKey, sale);
        if (saleTxt) removeRequirementText(noteArea, saleTxt);
        APC.setShopSale(fullState, shopKey, 'captures', null);
        APC.setShopSale(fullState, shopKey, 'abilities', null);
        saveFullState();
      }

      // Removes just ONE half (Capture or Ability) of a Shop's sale, leaving
      // the other half untouched. The full "sells" sentence ("Shop sells
      // Ability & Capture") is removed first, then rebuilt depending on
      // which half remains:
      //  - Capture removed, Ability remains -> "Shop sells Ability" (keeps "sells")
      //  - Ability removed, Capture remains -> just "Shop" (drops "sells" -
      //    "sells" always refers to the Ability half, so it has no meaning
      //    once the Ability is gone)
      //  - Neither remains -> just "Shop"
      function clearShopSaleHalf(shopKey, half) {
        const shopItem = APC.findItem('shops', shopKey);
        const prevSale = APC.getShopSale(fullState, shopKey);
        const prevTxt = shopSaleDisplayText(shopKey, prevSale);
        if (prevTxt) removeRequirementText(noteArea, prevTxt);

        APC.setShopSale(fullState, shopKey, half === 'ability' ? 'abilities' : 'captures', null);
        saveFullState();

        if (!shopItem) return;

        if (half === 'capture' && prevSale.ability) {
          const ablItem = APC.findItem('abilities', prevSale.ability);
          if (ablItem) {
            appendRequirementText(noteArea, shopItem.name + ' sells ' + ablItem.name);
            return;
          }
        }
        // Ability removed (or nothing usable remains) - "sells" no longer
        // applies, so fall back to the Shop's plain name only.
        appendRequirementText(noteArea, shopItem.name);
      }

      function renderReqIcons() {
        reqsWrap.innerHTML = '';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'zone-req-add';
        addBtn.title = 'Add a Capture, Ability, Refight, Shop, or Kingdom requirement';
        addBtn.textContent = '+';
        addBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          bounce(addBtn);
          openRequirementPicker(e, zs, noteArea, () => {
            renderReqIcons();
            saveFullState();
          });
        });
        reqsWrap.appendChild(addBtn);

        zs.requirements.forEach((req) => {
          const item = APC.findItem(req.kind, req.key);
          if (!item) return;

          if (req.kind === 'refights' || req.kind === 'shops') {
            // A Refight shows its own icon plus the paired Capture/Ability
            // icon riding right beside it (matching the "(Name)" text pair);
            // a Shop shows its shop.png icon plus its kingdom's icon the
            // same way. Either icon removes the whole pair (icons + text) -
            // they represent one requirement, not two. A Shop's "sells"
            // sentence (if any) has to come out too, and before the shop's
            // own name text - see the matching cleanup in buildPickerCell.
            const removeBoth = () => {
              if (req.kind === 'shops') clearShopSale(req.key);
              toggleRequirement(zs, req.kind, req.key, noteArea);
            };
            const group = document.createElement('span');
            group.className = 'zone-req-pair';
            group.appendChild(buildReqIconEl(req.kind, req.key, item, removeBoth, null, item.colors));
            if (item.pair) {
              const pairItem = APC.findItem(item.pair.kind, item.pair.key);
              if (pairItem) {
                group.appendChild(buildReqIconEl(item.pair.kind, item.pair.key, pairItem, removeBoth, 'zone-req-icon--pair', item.colors));
              }
            }
            reqsWrap.appendChild(group);

            // The Shop's sold Capture and Ability ride alongside it too, so
            // both halves are visible (and each removable with a single
            // click) without having to open the sale picker again. Clicking
            // either one clears the whole "sells" sentence and both halves
            // of the sale - not just the one icon clicked - since a partial
            // sale isn't a state the note text can represent cleanly.
            if (req.kind === 'shops') {
              const sale = APC.getShopSale(fullState, req.key);
              ['ability', 'capture'].forEach((half) => {
                const saleKind = half === 'ability' ? 'abilities' : 'captures';
                const saleKey = sale[half];
                if (!saleKey) return;
                const saleItem = APC.findItem(saleKind, saleKey);
                if (!saleItem) return;
                const removeSale = () => clearShopSaleHalf(req.key, half);
                reqsWrap.appendChild(buildReqIconEl(saleKind, saleKey, saleItem, removeSale));
              });
            }
            return;
          }

          reqsWrap.appendChild(buildReqIconEl(req.kind, req.key, item));
        });

        // Auto-detected items: anything typed in the note text that matches
        // a Capture/Ability/Refight/Kingdom name, but wasn't explicitly
        // picked. Shown faded; clicking pins it as a real requirement. A
        // Capture/Ability currently sold by one of this zone's Shops is
        // skipped here - it already got its own single-click-removable icon
        // above, right next to that Shop.
        const explicitIds = new Set();
        zs.requirements.forEach((r) => {
          explicitIds.add(r.kind + ':' + r.key);
          if (r.kind === 'refights') {
            const item = APC.findItem('refights', r.key);
            if (item && item.pair) explicitIds.add(item.pair.kind + ':' + item.pair.key);
          }
          if (r.kind === 'shops') {
            const sale = APC.getShopSale(fullState, r.key);
            if (sale.capture) explicitIds.add('captures:' + sale.capture);
            if (sale.ability) explicitIds.add('abilities:' + sale.ability);
          }
        });
        APC.detectItemsInText(noteArea.value).forEach((item) => {
          const id = item.kind + ':' + item.key;
          if (explicitIds.has(id)) return;
          const img = document.createElement('img');
          const kindClass =
            item.kind === 'abilities' ? 'zone-req-icon--ability' :
            item.kind === 'kingdoms'  ? 'zone-req-icon--kingdom'  :
            item.kind === 'refights'  ? 'zone-req-icon--refight'  :
            item.kind === 'shops'     ? 'zone-req-icon--shop'     : 'zone-req-icon--capture';
          img.className = 'zone-req-icon zone-req-icon--auto ' + kindClass;
          img.src = item.src;
          img.alt = item.name;
          img.title = item.name + ' (detected in note - click to pin)';
          if (item.kind === 'kingdoms' && item.color) img.style.setProperty('--kingdom-color', item.color);
          img.addEventListener('click', (e) => {
            e.stopPropagation();
            bounce(img);
            zs.requirements.push({ kind: item.kind, key: item.key });
            renderReqIcons();
            saveFullState();
          });
          reqsWrap.appendChild(img);
        });

        updateNoteColor();
      }
      renderReqIcons();

      top.appendChild(reqsWrap);

      const nameLabel = document.createElement('span');
      nameLabel.className = 'zone-name';
      nameLabel.textContent = zoneDisplayName(kingdom, zone);
      nameLabel.style.color = zs.collapsed ? '#888' : color;

      top.appendChild(nameLabel);
      row.appendChild(top);

      nameLabel.addEventListener('click', () => {
        zs.collapsed = !zs.collapsed;
        nameLabel.style.color = zs.collapsed ? '#888' : color;
        noteArea.style.display = zs.collapsed ? 'none' : '';
        saveFullState();
      });

      row.appendChild(noteArea);
      return row;
    }

    // ── Fullscreen image lightbox (used by the Dark Side map) ────────
    function ensureLightbox() {
      let lb = document.getElementById('lz-lightbox');
      if (lb) return lb;
      lb = document.createElement('div');
      lb.id = 'lz-lightbox';
      const img = document.createElement('img');
      lb.appendChild(img);
      lb.addEventListener('click', () => lb.classList.remove('active'));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') lb.classList.remove('active');
      });
      document.body.appendChild(lb);
      return lb;
    }

    function openLightbox(src, alt) {
      const lb = ensureLightbox();
      const img = lb.querySelector('img');
      img.src = src;
      img.alt = alt || '';
      // Force a reflow so the transition re-triggers even if the same
      // image is reopened right after being closed.
      lb.classList.remove('active');
      void lb.offsetWidth;
      requestAnimationFrame(() => lb.classList.add('active'));
    }

    // ── Requirement (Captures & Abilities) note helpers ───────────────
    // Appends `text` to the note textarea, joining onto whatever's already
    // there with " AND " unless the tail already ends in an open paren or a
    // dangling AND/OR (from the quick-insert buttons below), in which case
    // it's just added with a single separating space. The textarea stays a
    // normal freeform field the rest of the time - this only shapes what
    // gets inserted at the moment a Capture/Ability is picked.
    function appendRequirementText(noteArea, text) {
      const trimmedEnd = noteArea.value.replace(/\s+$/, '');
      let next;
      if (!trimmedEnd) {
        next = text;
      } else if (/\($/.test(trimmedEnd) || /\b(AND|OR)$/i.test(trimmedEnd)) {
        next = trimmedEnd + ' ' + text;
      } else {
        next = trimmedEnd + ' AND ' + text;
      }
      noteArea.value = next;
      noteArea.dispatchEvent(new Event('input', { bubbles: true }));
      noteArea.focus();
      noteArea.setSelectionRange(noteArea.value.length, noteArea.value.length);
    }

    // Inserts a bare AND / OR / ( / ) token at the end of the note text, for
    // building grouped combinations like "(Vault AND Goomba) OR Long Jump"
    // or "Vault AND (Goomba OR Long Jump)" by hand around the picked names.
    function insertNoteToken(noteArea, token) {
      const trimmedEnd = noteArea.value.replace(/\s+$/, '');
      let next;
      if (token === '(') {
        next = trimmedEnd ? trimmedEnd + ' (' : '(';
      } else if (token === ')') {
        next = trimmedEnd + ')';
      } else {
        next = trimmedEnd ? trimmedEnd + ' ' + token + ' ' : '';
      }
      noteArea.value = next;
      noteArea.dispatchEvent(new Event('input', { bubbles: true }));
      noteArea.focus();
      noteArea.setSelectionRange(noteArea.value.length, noteArea.value.length);
    }

    // Removes one requirement's name back out of the note textarea, plus any
    // AND/OR/brackets that only existed to connect or group it. Mirrors
    // appendRequirementText's insertion logic in reverse:
    //  1. Find the exact name as a standalone token (not part of a longer word).
    //  2. Prefer eating a *trailing* " AND "/" OR " with it (that's the connector
    //     appendRequirementText would have added after it); fall back to a
    //     *leading* one if there's no trailing connector (name was first, or
    //     last in the box).
    //  3. Clean up whatever that leaves behind: empty "()" pairs, an AND/OR left
    //     dangling right inside a bracket or at either end of the string, and
    //     brackets that no longer wrap more than one bare term (no longer
    //     "needed", per the grouping they used to do).
    // If the name isn't found verbatim (the user hand-edited the note), this is
    // a no-op - the icon still gets removed from the requirements list either way.
    function removeRequirementText(noteArea, name) {
      let text = noteArea.value;
      if (!text) return;

      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // Captures the char just before/after the name (or '' at a string edge) so
      // we can confirm it's a standalone token without relying on \b, since
      // names like "RC Car" or "Chargin' Chuck" mix word and non-word chars.
      const nameRe = new RegExp('(^|[^A-Za-z0-9])(' + escaped + ')($|[^A-Za-z0-9])', 'i');
      const m = nameRe.exec(text);
      if (!m) return;

      let start = m.index + m[1].length;
      let end = start + m[2].length;

      const afterConnector = /^(\s*)(AND|OR)\b(\s*)/i.exec(text.slice(end));
      if (afterConnector) {
        end += afterConnector[0].length;
      } else {
        const beforeConnector = /(\s*)\b(AND|OR)(\s*)$/i.exec(text.slice(0, start));
        if (beforeConnector) start -= beforeConnector[0].length;
      }

      text = text.slice(0, start) + text.slice(end);

      // Fixed-point cleanup: keep sweeping until nothing changes, since each
      // pass can expose a new dangling connector or redundant bracket pair
      // (e.g. removing the last item inside "(A AND B)" needs two sweeps: one
      // to drop the trailing "AND", another to unwrap the now-single "(A)").
      let prev;
      do {
        prev = text;
        text = text.replace(/\(\s*\)/g, '');                  // ()
        text = text.replace(/\(\s*(AND|OR)\b\s*/gi, '(');       // ( AND x -> (x
        text = text.replace(/\s*\b(AND|OR)\s*\)/gi, ')');       // x AND ) -> x)
        text = text.replace(/^\s*(AND|OR)\b\s*/i, '');          // leading AND/OR
        text = text.replace(/\s*\b(AND|OR)\s*$/i, '');          // trailing AND/OR
        text = text.replace(/\(([^()]+)\)/g, (whole, inner) => (
          /\b(AND|OR)\b/i.test(inner) ? whole : inner.trim()    // (X) -> X
        ));
        text = text.replace(/[ \t]{2,}/g, ' ').trim();
      } while (text !== prev);

      noteArea.value = text;
      noteArea.dispatchEvent(new Event('input', { bubbles: true }));
    }

    // Text inserted into the note for a given requirement. Captures/Abilities
    // just use their name; a Refight also shows the Capture/Ability it's
    // paired with in parentheses, e.g. "Knuckleotec Refight (Knucklotec's Fist)".
    function requirementDisplayText(kind, key) {
      const item = APC.findItem(kind, key);
      if (!item) return null;
      if (kind === 'refights' && item.pair) {
        const pairItem = APC.findItem(item.pair.kind, item.pair.key);
        if (pairItem) return item.name + ' (' + pairItem.name + ')';
      }
      return item.name;
    }

    // Text inserted into the note for a Shop's "for sale" pairing, e.g.
    // "Lost Shop sells Vault & Cactus" - shared between openShopSalePicker
    // (which writes it) and anywhere a Shop requirement gets removed (which
    // has to clean it back out again). Returns null while the sale is
    // incomplete, since there's nothing to write or remove.
    function shopSaleDisplayText(shopKey, sale) {
      const shopItem = APC.findItem('shops', shopKey);
      if (!shopItem || !sale || !sale.capture || !sale.ability) return null;
      const capItem = APC.findItem('captures', sale.capture);
      const ablItem = APC.findItem('abilities', sale.ability);
      if (!capItem || !ablItem) return null;
      return shopItem.name + ' sells ' + ablItem.name + ' & ' + capItem.name;
    }

    function toggleRequirement(zs, kind, key, noteArea) {
      if (!Array.isArray(zs.requirements)) zs.requirements = [];
      const idx = zs.requirements.findIndex(r => r.kind === kind && r.key === key);
      const text = requirementDisplayText(kind, key);
      if (idx >= 0) {
        zs.requirements.splice(idx, 1);
        if (text) removeRequirementText(noteArea, text);
        return false;
      }
      zs.requirements.push({ kind, key });
      if (text) appendRequirementText(noteArea, text);
      return true;
    }

    // Shared rows x cols grid-fit math (see updateGridFit inside
    // openRequirementPicker, which this mirrors) - used by the two smaller,
    // standalone popups below so their grids fill their box the same way.
    function fitPickerGrid(grid, itemCount, minCell) {
      if (!itemCount) itemCount = 1;
      const w = grid.clientWidth || 1;
      const h = grid.clientHeight || 1;
      const gap = 8;
      if (!minCell) minCell = 70;
      const maxCols = Math.max(1, Math.floor((w + gap) / (minCell + gap)));

      let best = null;
      for (let cols = 1; cols <= maxCols; cols++) {
        const rows = Math.ceil(itemCount / cols);
        const cellW = (w - gap * (cols - 1)) / cols;
        const cellH = (h - gap * (rows - 1)) / rows;
        if (cellW < minCell || cellH < minCell * 0.75) continue;
        const emptyCells = rows * cols - itemCount;
        const aspect = Math.max(cellW / cellH, cellH / cellW);
        const score = emptyCells * 1000 + aspect;
        if (!best || score < best.score) best = { cols, rows, score };
      }
      if (!best) best = { cols: maxCols, rows: Math.ceil(itemCount / maxCols) };

      grid.style.setProperty('--req-picker-cols', best.cols);
      grid.style.setProperty('--req-picker-rows', best.rows);
    }

    // ── Kingdom-only picker (Paintings column: a Painting's + button) ──
    // A single grid of all 18 Kingdoms, radio-select. Picking one calls
    // onPick(kingdomKey) and closes; there's no Captures/Abilities/Refights/
    // Shops here at all - a Painting only ever needs one destination.
    function openKingdomOnlyPicker(currentKey, onPick) {
      document.querySelectorAll('.req-picker-overlay').forEach(p => p.remove());

      const overlay = document.createElement('div');
      overlay.className = 'req-picker-overlay';
      const popup = document.createElement('div');
      popup.className = 'req-picker-popup req-picker-popup--scroll';
      popup.addEventListener('click', (e) => e.stopPropagation());
      overlay.appendChild(popup);

      const header = document.createElement('div');
      header.className = 'req-picker-header';
      const title = document.createElement('div');
      title.className = 'req-picker-title';
      title.textContent = 'Which Kingdom does this Painting lead to?';
      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'req-picker-close';
      closeBtn.textContent = '✕';
      closeBtn.title = 'Close';
      closeBtn.addEventListener('click', () => closePicker());
      header.appendChild(title);
      header.appendChild(closeBtn);
      popup.appendChild(header);

      const search = document.createElement('input');
      search.type = 'text';
      search.className = 'req-picker-search';
      search.placeholder = 'Search…';
      popup.appendChild(search);

      const grid = document.createElement('div');
      grid.className = 'req-picker-grid';
      popup.appendChild(grid);

      function render() {
        grid.innerHTML = '';
        const q = search.value.trim().toLowerCase();
        const list = q ? APC.KINGDOMS.filter(i => i.name.toLowerCase().includes(q)) : APC.KINGDOMS;
        fitPickerGrid(grid, list.length);
        if (!list.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          grid.appendChild(empty);
          return;
        }
        list.forEach(item => {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'req-picker-item req-picker-item--kingdom';
          cell.classList.toggle('selected', item.key === currentKey);
          if (item.color) cell.style.setProperty('--kingdom-color', item.color);
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.name;
          const label = document.createElement('span');
          label.textContent = item.name;
          cell.appendChild(img);
          cell.appendChild(label);
          cell.addEventListener('click', () => {
            bounce(cell);
            // A second click on the already-picked Kingdom clears it instead
            // of just re-picking the same one, so there's a way back to "no
            // destination set yet" without leaving the popup.
            onPick(item.key === currentKey ? null : item.key);
            closePicker();
          });
          grid.appendChild(cell);
        });
      }

      search.addEventListener('input', render);
      document.body.appendChild(overlay);
      render();
      requestAnimationFrame(render);
      const onResize = () => render();
      window.addEventListener('resize', onResize);

      function onKeyDown(e) { if (e.key === 'Escape') closePicker(); }
      function closePicker() {
        overlay.classList.remove('active');
        document.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('resize', onResize);
        setTimeout(() => overlay.remove(), 320);
      }
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });
      document.addEventListener('keydown', onKeyDown);

      void overlay.offsetWidth;
      requestAnimationFrame(() => overlay.classList.add('active'));
      search.focus();
    }

    // ── Shop "for sale" picker (Kingdom tab's Shop grid, and the Paintings
    // column's Shop rows) ──────────────────────────────────────────────
    // Every Shop always has exactly 1 Capture and 1 Ability for sale. Two
    // tabs, each a radio-select grid over the FULL list (all 52 Captures /
    // all 21 Abilities - not the trimmed Notes-picker Captures list), so any
    // shop's real in-game stock can be recorded. Picks save immediately
    // (no separate "confirm" step) via APC.setShopSale; onChange fires after
    // every pick and again on close so the calling row/cell can refresh.
    function openShopSalePicker(shopKey, onChange, noteArea, zs) {
      // Only clear out any other already-open sale popup (e.g. re-triggered
      // before the previous one animated closed) - NOT every .req-picker-
      // overlay, since this is very often opened from on top of the Kingdom
      // tab's "Add a Requirement" picker (clicking a Shop, or its 🏷 button),
      // which must stay open underneath so the user lands back in it once
      // they're done setting what's for sale.
      document.querySelectorAll('.req-picker-overlay--sale').forEach(p => p.remove());
      const shopItem = APC.findItem('shops', shopKey);

      // When called with a zone's noteArea (from the Kingdom tab's Shop
      // grid - either the shop's first-pick auto-prompt or its 🏷 edit
      // button), a completed sale (both halves set) also gets written into
      // that zone's note as plain text, e.g. "Lost Shop sells Swing &
      // Goomba" - mirroring how every other requirement's name gets
      // appended via appendRequirementText. Returns null while the sale is
      // still incomplete, since there's nothing sensible to write yet.
      function saleText(sale) {
        return shopSaleDisplayText(shopKey, sale);
      }

      const overlay = document.createElement('div');
      overlay.className = 'req-picker-overlay req-picker-overlay--sale';
      const popup = document.createElement('div');
      popup.className = 'req-picker-popup req-picker-popup--scroll req-picker-popup--shop-sale';
      popup.addEventListener('click', (e) => e.stopPropagation());
      overlay.appendChild(popup);

      const header = document.createElement('div');
      header.className = 'req-picker-header';
      const title = document.createElement('div');
      title.className = 'req-picker-title';
      title.textContent = (shopItem ? shopItem.name : 'Shop') + ' — Items For Sale';
      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'req-picker-close';
      closeBtn.textContent = '✕';
      closeBtn.title = 'Close';
      closeBtn.addEventListener('click', () => closePicker());
      header.appendChild(title);
      header.appendChild(closeBtn);
      popup.appendChild(header);

      const tabs = document.createElement('div');
      tabs.className = 'req-picker-tabs';
      const tabCaptures = document.createElement('button');
      tabCaptures.type = 'button';
      tabCaptures.className = 'req-picker-tab req-picker-tab--capture active';
      tabCaptures.textContent = 'Capture for Sale';
      const tabAbilities = document.createElement('button');
      tabAbilities.type = 'button';
      tabAbilities.className = 'req-picker-tab req-picker-tab--ability';
      tabAbilities.textContent = 'Ability for Sale';
      tabs.appendChild(tabCaptures);
      tabs.appendChild(tabAbilities);
      popup.appendChild(tabs);

      const search = document.createElement('input');
      search.type = 'text';
      search.className = 'req-picker-search';
      search.placeholder = 'Search…';
      popup.appendChild(search);

      const grid = document.createElement('div');
      grid.className = 'req-picker-grid';
      popup.appendChild(grid);

      let activeKind = 'captures';

      function render() {
        grid.innerHTML = '';
        const q = search.value.trim().toLowerCase();
        const list = activeKind === 'captures' ? APC.CAPTURES : APC.ABILITIES;
        const filtered = q ? list.filter(i => i.name.toLowerCase().includes(q)) : list;
        const sale = APC.getShopSale(fullState, shopKey);
        const selectedKey = activeKind === 'captures' ? sale.capture : sale.ability;
        fitPickerGrid(grid, filtered.length, 100);
        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          grid.appendChild(empty);
          return;
        }
        filtered.forEach(item => {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'req-picker-item ' + (activeKind === 'captures' ? 'req-picker-item--capture' : 'req-picker-item--ability');
          cell.classList.toggle('selected', item.key === selectedKey);
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.name;
          const label = document.createElement('span');
          label.textContent = item.name;
          cell.appendChild(img);
          cell.appendChild(label);
          cell.addEventListener('click', () => {
            bounce(cell);
            const alreadySelected = item.key === selectedKey;
            const prevSale = APC.getShopSale(fullState, shopKey);
            const prevText = noteArea ? saleText(prevSale) : null;
            APC.setShopSale(fullState, shopKey, activeKind, alreadySelected ? null : item.key);
            saveFullState();
            const sale = APC.getShopSale(fullState, shopKey);

            // Once both halves are set, write (or refresh) the "sells"
            // sentence into this zone's note, same as any other picked
            // requirement's name - and drop whatever the sentence used to
            // say if this pick changed or cleared it. The first time the
            // sentence gets written, the shop's own bare name text (e.g.
            // "Lost Shop") is already sitting in the note from when the
