<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Zone Notes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/SMO-ColoredGlobe.png">
  <style>
    /* Override the main stylesheet's page padding/sizing this page IS the window */
    html { height: 100%; }
    body.notes-page {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    .notes-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .notes-page-header h2 { font-size: 1.1rem; }
    #lz-content { padding: 16px; }

    /* ── Dark Side map thumbnail ──────────────────────────────────── */
    .lz-darkside-map-wrap {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      text-align: center;
    }
    .lz-darkside-map-wrap img {
      max-width: 100%;
      border-radius: 8px;
      cursor: zoom-in;
      display: block;
      margin: 0 auto;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .lz-darkside-map-wrap img:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 18px rgba(0,0,0,.55);
    }

    /* ── Fullscreen lightbox ──────────────────────────────────────── */
    #lz-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      opacity: 0;
      pointer-events: none;
      transition: background .35s ease, opacity .3s ease;
    }
    #lz-lightbox.active {
      background: rgba(0,0,0,.86);
      opacity: 1;
      pointer-events: auto;
    }
    #lz-lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 10px;
      box-shadow: 0 10px 60px rgba(0,0,0,.65);
      cursor: zoom-out;
      transform: scale(.6) rotate(-2deg);
      opacity: 0;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
    }
    #lz-lightbox.active img {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }
  </style>
</head>
<body class="notes-page">
  <div class="notes-page-header">
    <h2>Loading Zone Notes</h2>
    <div class="modal-header-actions">
      <button class="modal-icon-btn-red" id="notes-page-clear" title="Clear all notes">Clear</button>
    </div>
  </div>
  <div class="lz-scroll-wrap">
    <div id="lz-content"></div>
  </div>

  <script src="apc-data.js?v=3"></script>
  <script>
    'use strict';

    // Re-triggers the .click-bounce CSS animation on an element. Removing
    // the class first (and forcing a reflow) means rapid repeat clicks each
    // get their own fresh bounce instead of the animation silently no-op'ing
    // because the class was already present.
    function bounce(el) {
      if (!el) return;
      el.classList.remove('click-bounce');
      void el.offsetWidth;
      el.classList.add('click-bounce');
    }

    // ── Shared constants (mirrors app.js) ──────────────────────────
    const STATE_KEY = 'tracker_state';
    const MOBILE_BREAKPOINT  = 540;
    const ZONE_SPLIT_THRESHOLD = 10 ;

    const DEFAULT_SETTINGS = {
      show_moon_total:   true,
      moon_requirement:  124,
      show_icon_colors:  true,
      show_ability_lock: true,
      show_captures:     true,
      show_save_buttons: true,
      show_multi_moon:   true,
      show_kingdom_moon: false,
      overlay_scale:     1,
      notes_scroll_px:   100,
      scroll_left_binding:  { type: 'mouse', code: 3 },
      scroll_right_binding: { type: 'mouse', code: 4 },
      notes_layout:  'horizontal', // 'horizontal' | 'vertical'
      notes_columns: 2,            // vertical-mode kingdoms side-by-side (1|2|3)
      notes_compact: false,        // tighter spacing + shorter note boxes
      show_painting_notes: false,  // Paintings notes column (before Cascade); default off
      zone_names:    {},           // custom loading-zone name overrides
    };

    // Custom zone names live in settings.zone_names ({ kingdom: { zoneKey: name } }).
    // Empty/missing → default name. Shared with the tracker + map via tracker_state.
    function zoneDisplayName(kingdom, zone) {
      const byKingdom = fullState.settings.zone_names && fullState.settings.zone_names[kingdom];
      const custom = byKingdom && byKingdom[zone];
      return (custom && String(custom).trim()) ? custom : zone;
    }

    const LOADING_ZONES_TEMPLATE = {
      'Cap':        { color:'#fff500', icon:'Cap.png',      zones:{ 'Orange':{num:2},'Paragoomba':{num:2},'Frog':{num:2},'Rolling On':{num:2} }},
      'Cascade':    { color:'#ff9900', icon:'Cascade.png',  zones:{ 'Dino':{num:2},'2D':{num:2},'Chain Chomp':{num:2},'Swings':{num:2},'Windy':{num:2} }},
      'Sand':       { color:'#8bf12c', icon:'Sand.png',     zones:{ "Icy Cave":{num:1},"Moe-eye":{num:2},"Shop":{num:1},"Employees":{num:1},"Slots":{num:1},"Rumble":{num:1},"Outfit":{num:1},"Jaxi Ruins":{num:2},"Bullet Bill":{num:2},"Gushen":{num:2},"Sphynx":{num:1},"Moving Platform":{num:2},"Rocket":{num:2},"Colossal Ruins":{num:2}}},
      'Lake':       { color:'#e46cab', icon:'Lake.png',     zones:{ "Poison Waves":{num:2},"Zipper":{num:2},"Grab Climb":{num:2},"Shop":{num:1},"Puzzle":{num:1}}},
      'Wooded':     { color:'#1e65e7', icon:'Wooded.png',   zones:{ "Deep Woods Fall":{num:0},"Rocket":{num:2},"Sheep":{num:2},"Tank":{num:2},"Vine Clouds":{num:2},"Breakdown":{num:2},"Invisible":{num:2},"Flooded Pipes":{num:2},"Flower Road":{num:2},"Treasure Room":{num:1}}},
      'Lost':       { color:'#e71edd', icon:'Lost.png',     zones:{ 'Wiggler':{num:2},'Shop':{num:1},'Klepto':{num:2} }},
      'Metro':      { color:'#de7d5e', icon:'Metro.png',    zones:{ "Yellow Shop":{num:1},"Purple Shop":{num:1},"Dino":{num:2},"Bullet Billding":{num:2},"Taxi":{num:2},"Notes":{num:1},"2D":{num:2},"Slots":{num:1},"People":{num:2},"Outfit":{num:2},"Rocket":{num:2},"Dark":{num:2},"Scaffolding":{num:2},"Scooter":{num:2},"Rotating Maze":{num:2},"RC Car":{num:2}}},
      'Snow':       { color:'#e7930a', icon:'Snow.png',     zones:{ "Puzzle":{num:1},"Capless":{num:2},"Rocket Flower":{num:2},"Iceburn":{num:2},"Flower Road":{num:2},"Tracewalking":{num:1},"Clouds":{num:2},"Outfit":{num:2},"Shop":{num:1}}},
      'Seaside':    { color:'#b36fe9', icon:'Seaside.png',  zones:{ "Rumble":{num:1},"Rocket":{num:2},"Outfit":{num:1},"Gushen":{num:2},"Sphynx":{num:1},"Pokio":{num:2},"Lava Rising":{num:2},"Sandy Bottom":{num:1},"Spinning Maze":{num:2}}},
      'Luncheon':   { color:'#3fddbb', icon:'Luncheon.png', zones:{ "Magma Swamp":{num:2},"Forks":{num:2},"Cheese Rocks":{num:2},"Veggie Room":{num:1},"Slots":{num:1},"Shop":{num:1},"Outfit":{num:2},"Spinning Athletics":{num:2},"Lava Islands":{num:2},"Volcano Cave":{num:2},"Gears":{num:2},"Magma Path":{num:2}}},
      'Ruined':     { color:'#ffd7e2', icon:'Ruin.png',     zones:{ "Chargin' Chuck":{num:2},'Rocket':{num:2} }},
      "Bowser's":   { color:'#d3304c', icon:'Bowser.png',   zones:{ "Jizo":{num:2},"Shop":{num:1},"Outfit":{num:2},"Treasure Room":{num:1},"Spinning Tower":{num:2},"Vine Clouds":{num:2},"Hexagon Tower":{num:2},"Wooden Tower":{num:2}}},
      'Mushroom':   { color:'#fff672', icon:'Star.png',     zones:{ "Shop":{num:1},"Castle Door":{num:2},"Outfit":{num:2},"Cloud Sea":{num:2},"Well":{num:2},"Knucklotec":{num:1},"Torkdrift":{num:1},"Mechawiggler":{num:1},"Octopus":{num:1},"Cookatiel":{num:1},"Dragon":{num:1},"Rocket":{num:2}}},
      'Darkside':   { color:'#fff2c6', icon:'Dark.png',     zones:{ 'Breakdown':{num:2},'Invisible':{num:2},'Vanishing':{num:2},'Yoshi Siege':{num:2},'Lava Rising':{num:2},'Magma Swamp':{num:2} }},
      'Darkerside': { color:'#fff2c6', icon:'Dark.png',     zones:{ 'End':{num:1} }},
      'Moon':       { color:'#b5c1cb', icon:'MoonK.png',    zones:{ '2D Snowman': {num:2},'Shop': {num:1},'Swings': {num:2},'Sphynx': {num:1}} },
      'Cloud':      { color:'#65ceff', icon:'Cloud.png',    zones:{ '2D Cube': {num:2},'Picture Match': {num:2} } },
      'Deep Woods': { color:'#1e65e7', icon:'Wooded.png',   zones:{ "Vine #1 (Dino)":{num:0},"Vine #2 (Peculiar Pipes)":{num:0},"Vine #3 (Babbling Brook)":{num:0},"Vine #4 (Creek)":{num:0},"Treasure":{num:1},"Outfit":{num:1}}},
    };

    // Mirrors the map in app.js keep them in sync when adding a new
    // toggleable kingdom (see the comment next to KINGDOM_VISIBILITY_SETTINGS
    // in app.js for the full list of places to update).
    const KINGDOM_VISIBILITY_SETTINGS = {
      Moon: 'show_kingdom_moon',
    };

    // Paintings notes column (mirrors app.js): one note box per kingdom, no moons.
    const PAINTINGS_NOTES_KEY = 'Paintings';
    const PAINTING_NOTE_KINGDOMS = ['Cascade','Sand','Lake','Wooded','Metro','Snow','Seaside','Luncheon',"Bowser's",'Mushroom'];

    let fullState = null;

    function buildDefaultLoadingZones() {
      const result = {};
      for (const [kingdom, data] of Object.entries(LOADING_ZONES_TEMPLATE)) {
        result[kingdom] = { color: data.color, icon: data.icon, zones: {} };
        for (const [zone, zd] of Object.entries(data.zones)) {
          // requirements: ordered list of { kind: 'captures'|'abilities', key }
          // entries picked from the Abilities & Captures list (apc-data.js).
          // Their icons render above the location; their names are copied
          // into the note text but the text stays freely editable afterward.
          result[kingdom].zones[zone] = { note:'', requirements:[], collapsed:false, num: zd.num };
        }
      }
      return result;
    }

    function loadFullState() {
      try {
        const raw = localStorage.getItem(STATE_KEY);
        fullState = raw ? JSON.parse(raw) : {};
      } catch (e) {
        fullState = {};
      }

      if (!fullState.settings) {
        fullState.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
      } else {
        for (const key of Object.keys(DEFAULT_SETTINGS)) {
          if (!(key in fullState.settings)) fullState.settings[key] = DEFAULT_SETTINGS[key];
        }
      }

      const defaults = buildDefaultLoadingZones();
      if (!fullState.loading_zones) {
        fullState.loading_zones = defaults;
      } else {
        for (const [kingdom, data] of Object.entries(defaults)) {
          if (!fullState.loading_zones[kingdom]) {
            fullState.loading_zones[kingdom] = data;
          } else {
            for (const [zone, zd] of Object.entries(data.zones)) {
              if (!fullState.loading_zones[kingdom].zones[zone]) {
                fullState.loading_zones[kingdom].zones[zone] = zd;
              }
            }
          }
        }
      }

      // Seaside no longer has separate Well Enter/Exit zones - drop them from
      // any state saved before this change.
      const seaside = fullState.loading_zones['Seaside'];
      if (seaside) {
        delete seaside.zones['Well Enter'];
        delete seaside.zones['Well Exit'];
      }

      // Deep Woods "Vines" merge (mirrors app.js applyVinesMergeSetting).
      const dw = fullState.loading_zones['Deep Woods'];
      if (dw) {
        const vineKeys = ['Vine #1 (Dino)', 'Vine #2 (Peculiar Pipes)', 'Vine #3 (Babbling Brook)', 'Vine #4 (Creek)'];
        if (fullState.settings.merge_deep_woods_vines) {
          if (!dw.zones['Vines']) {
            dw.zones['Vines'] = { note: '', requirements: [], collapsed: false, num: 0 };
          }
          vineKeys.forEach(k => delete dw.zones[k]);
        } else {
          delete dw.zones['Vines'];
        }
      }

      // Migrate any zone saved before the Captures/Abilities requirement
      // system existed: drop the old Kingdom Moon icon fields and make sure
      // every zone has a requirements array to work with.
      for (const kingdom of Object.values(fullState.loading_zones)) {
        for (const zone of Object.values(kingdom.zones)) {
          if (!Array.isArray(zone.requirements)) zone.requirements = [];
          delete zone.icon;
          delete zone.icon2;
        }
      }

      if (!fullState.kingdom_collapsed) {
        fullState.kingdom_collapsed = Object.fromEntries(Object.keys(LOADING_ZONES_TEMPLATE).map(k => [k, false]));
      }
      if (!(PAINTINGS_NOTES_KEY in fullState.kingdom_collapsed)) {
        fullState.kingdom_collapsed[PAINTINGS_NOTES_KEY] = false;
      }
      if (!fullState.painting_notes) fullState.painting_notes = {};
      PAINTING_NOTE_KINGDOMS.forEach(k => {
        if (!(k in fullState.painting_notes)) fullState.painting_notes[k] = '';
      });
    }

    function saveFullState() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify(fullState));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    // Clears the note text and the selected Captures/Abilities requirements
    // in every zone, leaving collapsed/expanded state untouched.
    function clearAllNotes() {
      if (!confirm('Clear all loading zone notes? This cannot be undone.')) return;
      for (const kingdom of Object.values(fullState.loading_zones)) {
        for (const zone of Object.values(kingdom.zones)) {
          zone.note = '';
          zone.requirements = [];
        }
      }
      if (fullState.painting_notes) {
        for (const k of Object.keys(fullState.painting_notes)) fullState.painting_notes[k] = '';
      }
      saveFullState();
      buildLoadingZonesContent();
    }

    // ── Notes layout: orientation / column count / compact ───────────
    // Class-driven on #lz-content so switching is instant. Settings persist
    // to localStorage and are shared with the in-page modal in app.js.
    function normalizeNotesCols(v) {
      return (v === 1 || v === 3) ? v : 2;
    }

    function applyNotesLayout() {
      const content = document.getElementById('lz-content');
      if (!content) return;
      const s = fullState.settings;
      const vertical = s.notes_layout === 'vertical';
      const cols = normalizeNotesCols(s.notes_columns);
      content.classList.toggle('lz-layout-vertical', vertical);
      content.classList.toggle('lz-layout-horizontal', !vertical);
      content.classList.remove('lz-cols-1', 'lz-cols-2', 'lz-cols-3');
      content.classList.add('lz-cols-' + cols);
      content.classList.toggle('lz-compact', !!s.notes_compact);
      syncNotesToolbar();
    }

    function syncNotesToolbar() {
      const bar = document.querySelector('.lz-toolbar');
      if (!bar) return;
      const s = fullState.settings;
      const vertical = s.notes_layout === 'vertical';
      const cols = normalizeNotesCols(s.notes_columns);
      bar.classList.toggle('orient-vertical', vertical);
      bar.querySelectorAll('[data-orient]').forEach(b =>
        b.classList.toggle('active', (b.dataset.orient === 'vertical') === vertical));
      bar.querySelectorAll('[data-cols]').forEach(b =>
        b.classList.toggle('active', Number(b.dataset.cols) === cols));
      const compactBtn = bar.querySelector('[data-compact]');
      if (compactBtn) compactBtn.classList.toggle('active', !!s.notes_compact);
    }

    function autosizeNotes(root) {
      // Only measure boxes that actually have text (an empty note is already a
      // correct single row), and batch reset/read/apply into three phases so we
      // don't force a full reflow of the notes masonry on every single box.
      // Interleaving write→read→write per box is what made this view slow.
      const nodes = Array.from((root || document).querySelectorAll('.zone-note'))
        .filter(t => t.style.display !== 'none' && t.value.trim() !== '');
      if (!nodes.length) return;
      nodes.forEach(t => { t.style.height = 'auto'; });
      const heights = nodes.map(t => t.scrollHeight);
      nodes.forEach((t, i) => { t.style.height = heights[i] + 'px'; });
    }

    function ensureNotesToolbar() {
      const scrollWrap = document.querySelector('.lz-scroll-wrap');
      if (!scrollWrap || !scrollWrap.parentElement) return;
      if (document.querySelector('.lz-toolbar')) return;

      const bar = document.createElement('div');
      bar.className = 'lz-toolbar';
      bar.innerHTML =
        '<div class="lz-toolbar-group">' +
          '<span class="lz-toolbar-label">Layout</span>' +
          '<div class="segmented">' +
            '<button class="seg-btn" data-orient="horizontal">Horizontal</button>' +
            '<button class="seg-btn" data-orient="vertical">Vertical</button>' +
          '</div>' +
        '</div>' +
        '<div class="lz-toolbar-group lz-cols-group">' +
          '<span class="lz-toolbar-label">Columns</span>' +
          '<div class="segmented">' +
            '<button class="seg-btn" data-cols="1">1</button>' +
            '<button class="seg-btn" data-cols="2">2</button>' +
            '<button class="seg-btn" data-cols="3">3</button>' +
          '</div>' +
        '</div>' +
        '<div class="lz-toolbar-group">' +
          '<button class="lz-compact-btn" data-compact>Compact</button>' +
        '</div>';

      bar.querySelectorAll('[data-orient]').forEach(b =>
        b.addEventListener('click', () => {
          fullState.settings.notes_layout = b.dataset.orient;
          saveFullState();
          applyNotesLayout();
        }));
      bar.querySelectorAll('[data-cols]').forEach(b =>
        b.addEventListener('click', () => {
          fullState.settings.notes_columns = Number(b.dataset.cols);
          fullState.settings.notes_layout = 'vertical';
          saveFullState();
          applyNotesLayout();
        }));
      const compactBtn = bar.querySelector('[data-compact]');
      compactBtn.addEventListener('click', () => {
        fullState.settings.notes_compact = !fullState.settings.notes_compact;
        saveFullState();
        applyNotesLayout();
      });

      scrollWrap.parentElement.insertBefore(bar, scrollWrap);
    }

    // ── Build kingdom list ──────────────────────────────────────────
    function buildLoadingZonesContent() {
      const container = document.getElementById('lz-content');
      container.innerHTML = '';
      if (fullState.settings.show_painting_notes) {
        container.appendChild(buildPaintingNotesColumn());
      }
      for (const [kingdom, data] of Object.entries(fullState.loading_zones)) {
        const settingKey = KINGDOM_VISIBILITY_SETTINGS[kingdom];
        if (settingKey && !fullState.settings[settingKey]) continue;
        container.appendChild(buildKingdomColumn(kingdom, data));
      }
      applyNotesLayout();
      autosizeNotes(container);
    }

    // Paintings notes column: one note box per kingdom, no moon icons.
    function buildPaintingNotesColumn() {
      if (!fullState.painting_notes) fullState.painting_notes = {};
      const col = document.createElement('div');
      col.className = 'kingdom-col';

      const header = document.createElement('div');
      header.className = 'kingdom-col-header';

      const icon = document.createElement('img');
      icon.src = 'assets/Painting.png';
      icon.height = 20;
      icon.alt = 'Paintings';

      const title = document.createElement('span');
      title.className = 'col-title';
      title.textContent = 'Paintings';
      title.style.color = '#e6e6ee';

      const chevron = document.createElement('span');
      chevron.className = 'col-chevron';
      chevron.textContent = '▾';

      header.appendChild(icon);
      header.appendChild(title);
      header.appendChild(chevron);

      const zonesRoot = document.createElement('div');
      zonesRoot.className = 'zones-container';

      PAINTING_NOTE_KINGDOMS.forEach(kingdom => {
        if (!(kingdom in fullState.painting_notes)) fullState.painting_notes[kingdom] = '';
        const kd = LOADING_ZONES_TEMPLATE[kingdom] || { color: '#e6e6ee' };
        const row = document.createElement('div');
        row.className = 'zone-row';

        const top = document.createElement('div');
        top.className = 'zone-row-top';
        const nameLabel = document.createElement('span');
        nameLabel.className = 'zone-name';
        nameLabel.textContent = kingdom;
        nameLabel.style.color = kd.color;
        top.appendChild(nameLabel);
        row.appendChild(top);

        const noteArea = document.createElement('textarea');
        noteArea.className = 'zone-note';
        noteArea.value = fullState.painting_notes[kingdom] || '';
        noteArea.placeholder = 'Note…';
        noteArea.rows = 1;
        noteArea.addEventListener('input', () => {
          fullState.painting_notes[kingdom] = noteArea.value;
          saveFullState();
          requestAnimationFrame(() => {
            noteArea.style.height = 'auto';
            noteArea.style.height = noteArea.scrollHeight + 'px';
          });
        });
        row.appendChild(noteArea);
        zonesRoot.appendChild(row);
      });

      if (fullState.kingdom_collapsed[PAINTINGS_NOTES_KEY]) {
        zonesRoot.style.display = 'none';
        header.classList.add('collapsed');
      }
      header.addEventListener('click', () => {
        const willCollapse = zonesRoot.style.display !== 'none';
        zonesRoot.style.display = willCollapse ? 'none' : '';
        header.classList.toggle('collapsed', willCollapse);
        fullState.kingdom_collapsed[PAINTINGS_NOTES_KEY] = willCollapse;
        saveFullState();
      });

      col.appendChild(header);
      col.appendChild(zonesRoot);
      return col;
    }

    function buildKingdomColumn(kingdom, data) {
      const col = document.createElement('div');
      col.className = 'kingdom-col';

      const header = document.createElement('div');
      header.className = 'kingdom-col-header';

      const icon = document.createElement('img');
      icon.src = `assets/${data.icon}`;
      icon.height = 20;
      icon.alt = kingdom;

      const title = document.createElement('span');
      title.className = 'col-title';
      title.textContent = kingdom;
      title.style.color = data.color;

      const chevron = document.createElement('span');
      chevron.className = 'col-chevron';
      chevron.textContent = '▾';

      header.appendChild(icon);
      header.appendChild(title);
      header.appendChild(chevron);

      const zoneEntries = Object.entries(data.zones);
      const needsSplit  = zoneEntries.length > ZONE_SPLIT_THRESHOLD;

      let zonesRoot;
      if (needsSplit) {
        const mid = Math.ceil(zoneEntries.length / 2);
        zonesRoot = document.createElement('div');
        zonesRoot.className = 'zones-split-wrap';

        const col1 = document.createElement('div');
        col1.className = 'zones-container';
        const col2 = document.createElement('div');
        col2.className = 'zones-container';

        zoneEntries.slice(0, mid).forEach(([zone, zd]) =>
          col1.appendChild(buildZoneRow(kingdom, zone, zd, data.color)));
        zoneEntries.slice(mid).forEach(([zone, zd]) =>
          col2.appendChild(buildZoneRow(kingdom, zone, zd, data.color)));

        zonesRoot.appendChild(col1);
        zonesRoot.appendChild(col2);
      } else {
        zonesRoot = document.createElement('div');
        zonesRoot.className = 'zones-container';
        zoneEntries.forEach(([zone, zd]) =>
          zonesRoot.appendChild(buildZoneRow(kingdom, zone, zd, data.color)));
      }

      // Dark Side gets a map thumbnail under its zones. It lives inside
      // zonesRoot so it collapses/expands right along with the zone notes
      // above it - "opening" the kingdom is what reveals it. Click it to
      // blow it up fullscreen; click (or Esc) to shrink it back down.
      if (kingdom === 'Darkside') {
        const mapWrap = document.createElement('div');
        mapWrap.className = 'lz-darkside-map-wrap';
        const mapImg = document.createElement('img');
        mapImg.src = 'assets/darksidemap.png';
        mapImg.alt = 'Dark Side Map';
        mapImg.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(mapImg.src, mapImg.alt);
        });
        mapWrap.appendChild(mapImg);
        zonesRoot.appendChild(mapWrap);
      }

      if (fullState.kingdom_collapsed[kingdom]) {
        zonesRoot.style.display = 'none';
        header.classList.add('collapsed');
      }

      header.addEventListener('click', () => {
        const willCollapse = zonesRoot.style.display !== 'none';
        zonesRoot.style.display = willCollapse ? 'none' : '';
        header.classList.toggle('collapsed', willCollapse);
        fullState.kingdom_collapsed[kingdom] = willCollapse;
        saveFullState();
        // layoutMasonryColumns();
      });

      col.appendChild(header);
      col.appendChild(zonesRoot);
      return col;
    }

    function buildZoneRow(kingdom, zone, zoneData, color) {
      const zs = fullState.loading_zones[kingdom].zones[zone];
      if (!Array.isArray(zs.requirements)) zs.requirements = [];
      const row = document.createElement('div');
      row.className = 'zone-row';

      const top = document.createElement('div');
      top.className = 'zone-row-top';

      const reqsWrap = document.createElement('div');
      reqsWrap.className = 'zone-reqs';

      // Note textarea is built first (but appended later) so the requirement
      // icons/picker above can read from and write into it.
      const noteArea = document.createElement('textarea');
      noteArea.className = 'zone-note';
      noteArea.value = zs.note || '';
      noteArea.placeholder = 'Note…';
      noteArea.rows = 1;
      if (zs.collapsed) noteArea.style.display = 'none';

      noteArea.addEventListener('input', () => {
        zs.note = noteArea.value;
        saveFullState();
        // Icons/coloring driven off note text (auto-detected items, Kingdom
        // tint) need to stay live while typing, but they're cheap DOM-only
        // updates to reqsWrap/noteArea - they don't touch the textarea's own
        // value or selection, so they never fight the keystroke or steal focus.
        renderReqIcons();
        // Deferred to the next frame so the height change (and the
        // scroll-container reflow it can trigger) happens after the
        // browser has finished handling this keystroke, instead of
        // racing it and kicking focus out of the box.
        requestAnimationFrame(() => {
          noteArea.style.height = 'auto';
          noteArea.style.height = noteArea.scrollHeight + 'px';
        });
      });

      // Kingdom color: a Kingdom note "colors in" the box - tint the
      // textarea with that kingdom's color. Looks first at an explicitly
      // picked Kingdom requirement, then falls back to a Kingdom name typed
      // (and auto-detected) directly in the note text.
      function currentKingdomColor() {
        const explicit = zs.requirements.find(r => r.kind === 'kingdoms');
        if (explicit) {
          const item = APC.findItem('kingdoms', explicit.key);
          if (item) return item.color;
        }
        const detected = APC.detectItemsInText(noteArea.value).find(i => i.kind === 'kingdoms');
        return detected ? detected.color : null;
      }

      function hexToRgba(hex, alpha) {
        const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
        if (!m) return null;
        const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      }

      function updateNoteColor() {
        const color = currentKingdomColor();
        if (color) {
          noteArea.style.borderColor = color;
          noteArea.style.background = hexToRgba(color, 0.14) || '';
          noteArea.style.boxShadow = '0 0 0 1px ' + (hexToRgba(color, 0.35) || 'transparent') + ' inset';
        } else {
          noteArea.style.borderColor = '';
          noteArea.style.background = '';
          noteArea.style.boxShadow = '';
        }
      }

      // Builds one clickable icon chip for an explicitly-picked requirement.
      // `onRemove`, if given, overrides what a click removes (used by
      // Refights so either half of the pair deletes the whole thing).
      // `extraClass`, if given, is added on top of the kind-based class
      // (used for the smaller "paired" icon riding next to a refight icon).
      function buildReqIconEl(kind, key, item, onRemove, extraClass, refightColors) {
        const img = document.createElement('img');
        const kindClass =
          kind === 'abilities' ? 'zone-req-icon--ability' :
          kind === 'kingdoms'  ? 'zone-req-icon--kingdom'  :
          kind === 'refights'  ? 'zone-req-icon--refight'  : 'zone-req-icon--capture';
        img.className = 'zone-req-icon ' + kindClass + (extraClass ? ' ' + extraClass : '');
        img.src = item.src;
        img.alt = item.name;
        img.title = item.name + ' (click to remove)';
        if (kind === 'kingdoms' && item.color) img.style.setProperty('--kingdom-color', item.color);
        if (refightColors) {
          img.classList.add('zone-req-icon--refight-active');
          img.style.setProperty('--refight-c1', refightColors[0]);
          img.style.setProperty('--refight-c2', refightColors[1]);
        }
        img.addEventListener('click', (e) => {
          e.stopPropagation();
          bounce(img);
          if (onRemove) {
            onRemove();
          } else {
            toggleRequirement(zs, kind, key, noteArea);
          }
          renderReqIcons();
          saveFullState();
        });
        return img;
      }

      function renderReqIcons() {
        reqsWrap.innerHTML = '';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'zone-req-add';
        addBtn.title = 'Add a Capture, Ability, Refight, or Kingdom requirement';
        addBtn.textContent = '+';
        addBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          bounce(addBtn);
          openRequirementPicker(e, zs, noteArea, () => {
            renderReqIcons();
            saveFullState();
          });
        });
        reqsWrap.appendChild(addBtn);

        zs.requirements.forEach((req) => {
          const item = APC.findItem(req.kind, req.key);
          if (!item) return;

          if (req.kind === 'refights') {
            // A refight shows its own icon plus the paired Capture/Ability
            // icon riding right beside it, matching the "(Name)" text pair.
            // Either icon removes the whole pair (icons + text) - they
            // represent one requirement, not two.
            const removeBoth = () => toggleRequirement(zs, 'refights', req.key, noteArea);
            const group = document.createElement('span');
            group.className = 'zone-req-pair';
            group.appendChild(buildReqIconEl('refights', req.key, item, removeBoth, null, item.colors));
            if (item.pair) {
              const pairItem = APC.findItem(item.pair.kind, item.pair.key);
              if (pairItem) {
                group.appendChild(buildReqIconEl(item.pair.kind, item.pair.key, pairItem, removeBoth, 'zone-req-icon--pair', item.colors));
              }
            }
            reqsWrap.appendChild(group);
            return;
          }

          reqsWrap.appendChild(buildReqIconEl(req.kind, req.key, item));
        });

        // Auto-detected items: anything typed in the note text that matches
        // a Capture/Ability/Refight/Kingdom name, but wasn't explicitly
        // picked. Shown faded; clicking pins it as a real requirement.
        const explicitIds = new Set();
        zs.requirements.forEach((r) => {
          explicitIds.add(r.kind + ':' + r.key);
          if (r.kind === 'refights') {
            const item = APC.findItem('refights', r.key);
            if (item && item.pair) explicitIds.add(item.pair.kind + ':' + item.pair.key);
          }
        });
        APC.detectItemsInText(noteArea.value).forEach((item) => {
          const id = item.kind + ':' + item.key;
          if (explicitIds.has(id)) return;
          const img = document.createElement('img');
          const kindClass =
            item.kind === 'abilities' ? 'zone-req-icon--ability' :
            item.kind === 'kingdoms'  ? 'zone-req-icon--kingdom'  :
            item.kind === 'refights'  ? 'zone-req-icon--refight'  : 'zone-req-icon--capture';
          img.className = 'zone-req-icon zone-req-icon--auto ' + kindClass;
          img.src = item.src;
          img.alt = item.name;
          img.title = item.name + ' (detected in note - click to pin)';
          if (item.kind === 'kingdoms' && item.color) img.style.setProperty('--kingdom-color', item.color);
          img.addEventListener('click', (e) => {
            e.stopPropagation();
            bounce(img);
            zs.requirements.push({ kind: item.kind, key: item.key });
            renderReqIcons();
            saveFullState();
          });
          reqsWrap.appendChild(img);
        });

        updateNoteColor();
      }
      renderReqIcons();

      top.appendChild(reqsWrap);

      const nameLabel = document.createElement('span');
      nameLabel.className = 'zone-name';
      nameLabel.textContent = zoneDisplayName(kingdom, zone);
      nameLabel.style.color = zs.collapsed ? '#888' : color;

      top.appendChild(nameLabel);
      row.appendChild(top);

      nameLabel.addEventListener('click', () => {
        zs.collapsed = !zs.collapsed;
        nameLabel.style.color = zs.collapsed ? '#888' : color;
        noteArea.style.display = zs.collapsed ? 'none' : '';
        saveFullState();
      });

      row.appendChild(noteArea);
      return row;
    }

    // ── Fullscreen image lightbox (used by the Dark Side map) ────────
    function ensureLightbox() {
      let lb = document.getElementById('lz-lightbox');
      if (lb) return lb;
      lb = document.createElement('div');
      lb.id = 'lz-lightbox';
      const img = document.createElement('img');
      lb.appendChild(img);
      lb.addEventListener('click', () => lb.classList.remove('active'));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') lb.classList.remove('active');
      });
      document.body.appendChild(lb);
      return lb;
    }

    function openLightbox(src, alt) {
      const lb = ensureLightbox();
      const img = lb.querySelector('img');
      img.src = src;
      img.alt = alt || '';
      // Force a reflow so the transition re-triggers even if the same
      // image is reopened right after being closed.
      lb.classList.remove('active');
      void lb.offsetWidth;
      requestAnimationFrame(() => lb.classList.add('active'));
    }

    // ── Requirement (Captures & Abilities) note helpers ───────────────
    // Appends `text` to the note textarea, joining onto whatever's already
    // there with " AND " unless the tail already ends in an open paren or a
    // dangling AND/OR (from the quick-insert buttons below), in which case
    // it's just added with a single separating space. The textarea stays a
    // normal freeform field the rest of the time - this only shapes what
    // gets inserted at the moment a Capture/Ability is picked.
    function appendRequirementText(noteArea, text) {
      const trimmedEnd = noteArea.value.replace(/\s+$/, '');
      let next;
      if (!trimmedEnd) {
        next = text;
      } else if (/\($/.test(trimmedEnd) || /\b(AND|OR)$/i.test(trimmedEnd)) {
        next = trimmedEnd + ' ' + text;
      } else {
        next = trimmedEnd + ' AND ' + text;
      }
      noteArea.value = next;
      noteArea.dispatchEvent(new Event('input', { bubbles: true }));
      noteArea.focus();
      noteArea.setSelectionRange(noteArea.value.length, noteArea.value.length);
    }

    // Inserts a bare AND / OR / ( / ) token at the end of the note text, for
    // building grouped combinations like "(Vault AND Goomba) OR Long Jump"
    // or "Vault AND (Goomba OR Long Jump)" by hand around the picked names.
    function insertNoteToken(noteArea, token) {
      const trimmedEnd = noteArea.value.replace(/\s+$/, '');
      let next;
      if (token === '(') {
        next = trimmedEnd ? trimmedEnd + ' (' : '(';
      } else if (token === ')') {
        next = trimmedEnd + ')';
      } else {
        next = trimmedEnd ? trimmedEnd + ' ' + token + ' ' : '';
      }
      noteArea.value = next;
      noteArea.dispatchEvent(new Event('input', { bubbles: true }));
      noteArea.focus();
      noteArea.setSelectionRange(noteArea.value.length, noteArea.value.length);
    }

    // Removes one requirement's name back out of the note textarea, plus any
    // AND/OR/brackets that only existed to connect or group it. Mirrors
    // appendRequirementText's insertion logic in reverse:
    //  1. Find the exact name as a standalone token (not part of a longer word).
    //  2. Prefer eating a *trailing* " AND "/" OR " with it (that's the connector
    //     appendRequirementText would have added after it); fall back to a
    //     *leading* one if there's no trailing connector (name was first, or
    //     last in the box).
    //  3. Clean up whatever that leaves behind: empty "()" pairs, an AND/OR left
    //     dangling right inside a bracket or at either end of the string, and
    //     brackets that no longer wrap more than one bare term (no longer
    //     "needed", per the grouping they used to do).
    // If the name isn't found verbatim (the user hand-edited the note), this is
    // a no-op - the icon still gets removed from the requirements list either way.
    function removeRequirementText(noteArea, name) {
      let text = noteArea.value;
      if (!text) return;

      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // Captures the char just before/after the name (or '' at a string edge) so
      // we can confirm it's a standalone token without relying on \b, since
      // names like "RC Car" or "Chargin' Chuck" mix word and non-word chars.
      const nameRe = new RegExp('(^|[^A-Za-z0-9])(' + escaped + ')($|[^A-Za-z0-9])', 'i');
      const m = nameRe.exec(text);
      if (!m) return;

      let start = m.index + m[1].length;
      let end = start + m[2].length;

      const afterConnector = /^(\s*)(AND|OR)\b(\s*)/i.exec(text.slice(end));
      if (afterConnector) {
        end += afterConnector[0].length;
      } else {
        const beforeConnector = /(\s*)\b(AND|OR)(\s*)$/i.exec(text.slice(0, start));
        if (beforeConnector) start -= beforeConnector[0].length;
      }

      text = text.slice(0, start) + text.slice(end);

      // Fixed-point cleanup: keep sweeping until nothing changes, since each
      // pass can expose a new dangling connector or redundant bracket pair
      // (e.g. removing the last item inside "(A AND B)" needs two sweeps: one
      // to drop the trailing "AND", another to unwrap the now-single "(A)").
      let prev;
      do {
        prev = text;
        text = text.replace(/\(\s*\)/g, '');                  // ()
        text = text.replace(/\(\s*(AND|OR)\b\s*/gi, '(');       // ( AND x -> (x
        text = text.replace(/\s*\b(AND|OR)\s*\)/gi, ')');       // x AND ) -> x)
        text = text.replace(/^\s*(AND|OR)\b\s*/i, '');          // leading AND/OR
        text = text.replace(/\s*\b(AND|OR)\s*$/i, '');          // trailing AND/OR
        text = text.replace(/\(([^()]+)\)/g, (whole, inner) => (
          /\b(AND|OR)\b/i.test(inner) ? whole : inner.trim()    // (X) -> X
        ));
        text = text.replace(/[ \t]{2,}/g, ' ').trim();
      } while (text !== prev);

      noteArea.value = text;
      noteArea.dispatchEvent(new Event('input', { bubbles: true }));
    }

    // Text inserted into the note for a given requirement. Captures/Abilities
    // just use their name; a Refight also shows the Capture/Ability it's
    // paired with in parentheses, e.g. "Knuckleotec Refight (Knucklotec's Fist)".
    function requirementDisplayText(kind, key) {
      const item = APC.findItem(kind, key);
      if (!item) return null;
      if (kind === 'refights' && item.pair) {
        const pairItem = APC.findItem(item.pair.kind, item.pair.key);
        if (pairItem) return item.name + ' (' + pairItem.name + ')';
      }
      return item.name;
    }

    function toggleRequirement(zs, kind, key, noteArea) {
      if (!Array.isArray(zs.requirements)) zs.requirements = [];
      const idx = zs.requirements.findIndex(r => r.kind === kind && r.key === key);
      const text = requirementDisplayText(kind, key);
      if (idx >= 0) {
        zs.requirements.splice(idx, 1);
        if (text) removeRequirementText(noteArea, text);
        return false;
      }
      zs.requirements.push({ kind, key });
      if (text) appendRequirementText(noteArea, text);
      return true;
    }

    // ── Requirement Picker (replaces the old Kingdom Moon icon picker) ─
    // Two tabbed groups - Captures and Abilities, sourced from apc-data.js -
    // plus a quick-insert AND/OR/() toolbar for grouping. Picking an entry
    // adds its icon above the location and its name into the note text.
    // Presented as a fullscreen overlay (same fade+pop-in language as the
    // Dark Side map lightbox above) with a big, easy-to-click icon grid.
    function openRequirementPicker(event, zs, noteArea, onChange) {
      document.querySelectorAll('.req-picker-overlay').forEach(p => p.remove());

      const overlay = document.createElement('div');
      overlay.className = 'req-picker-overlay';

      const popup = document.createElement('div');
      popup.className = 'req-picker-popup';
      popup.addEventListener('click', (e) => e.stopPropagation());
      overlay.appendChild(popup);

      const header = document.createElement('div');
      header.className = 'req-picker-header';
      const title = document.createElement('div');
      title.className = 'req-picker-title';
      title.textContent = 'Add a Requirement';
      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'req-picker-close';
      closeBtn.textContent = '✕';
      closeBtn.title = 'Close';
      closeBtn.addEventListener('click', () => closePicker());
      header.appendChild(title);
      header.appendChild(closeBtn);
      popup.appendChild(header);

      const toolbar = document.createElement('div');
      toolbar.className = 'req-picker-toolbar';
      const TOK_CLASS = { AND: 'req-picker-tok--and', OR: 'req-picker-tok--or', '(': 'req-picker-tok--paren', ')': 'req-picker-tok--paren' };
      ['AND', 'OR', '(', ')'].forEach(tok => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = tok;
        btn.title = 'Insert ' + tok + ' into the note';
        if (TOK_CLASS[tok]) btn.classList.add(TOK_CLASS[tok]);
        btn.addEventListener('click', () => insertNoteToken(noteArea, tok));
        toolbar.appendChild(btn);
      });
      popup.appendChild(toolbar);

      const tabs = document.createElement('div');
      tabs.className = 'req-picker-tabs';
      const tabCaptures = document.createElement('button');
      tabCaptures.type = 'button';
      tabCaptures.className = 'req-picker-tab req-picker-tab--capture active';
      tabCaptures.textContent = 'Captures';
      const tabAbilities = document.createElement('button');
      tabAbilities.type = 'button';
      tabAbilities.className = 'req-picker-tab req-picker-tab--ability';
      tabAbilities.textContent = 'Abilities';
      const tabKingdom = document.createElement('button');
      tabKingdom.type = 'button';
      tabKingdom.className = 'req-picker-tab req-picker-tab--kingdom';
      tabKingdom.textContent = 'Kingdom';
      tabs.appendChild(tabCaptures);
      tabs.appendChild(tabAbilities);
      tabs.appendChild(tabKingdom);
      popup.appendChild(tabs);

      const search = document.createElement('input');
      search.type = 'text';
      search.className = 'req-picker-search';
      search.placeholder = 'Search…';
      popup.appendChild(search);

      const grid = document.createElement('div');
      grid.className = 'req-picker-grid';
      popup.appendChild(grid);

      // Kingdom tab: two side-by-side sections instead of the single grid -
      // Refights on the left, Reaching Kingdoms on the right.
      const kingdomWrap = document.createElement('div');
      kingdomWrap.className = 'req-picker-kingdom-wrap';
      kingdomWrap.style.display = 'none';

      const refightCol = document.createElement('div');
      refightCol.className = 'req-picker-kingdom-col';
      const refightTitle = document.createElement('div');
      refightTitle.className = 'req-picker-kingdom-col-title';
      refightTitle.textContent = 'Refights';
      const refightGrid = document.createElement('div');
      refightGrid.className = 'req-picker-grid req-picker-grid--sub';
      refightCol.appendChild(refightTitle);
      refightCol.appendChild(refightGrid);

      const kingdomCol = document.createElement('div');
      kingdomCol.className = 'req-picker-kingdom-col';
      const kingdomTitle = document.createElement('div');
      kingdomTitle.className = 'req-picker-kingdom-col-title';
      kingdomTitle.textContent = 'Reaching Kingdoms';
      const kingdomGrid = document.createElement('div');
      kingdomGrid.className = 'req-picker-grid req-picker-grid--sub';
      kingdomCol.appendChild(kingdomTitle);
      kingdomCol.appendChild(kingdomGrid);

      kingdomWrap.appendChild(refightCol);
      kingdomWrap.appendChild(kingdomCol);
      popup.appendChild(kingdomWrap);

      let activeKind = 'captures';

      // Computes a rows x cols grid that (a) has at least itemCount cells,
      // (b) fills the box's actual width/height with no leftover gap, and
      // (c) keeps cells reasonably icon-shaped rather than very long
      // slivers. Re-run whenever the item count or box size changes, so
      // adding more captures/abilities later never requires a manual tweak.
      function updateGridFit(itemCount) {
        if (!itemCount) itemCount = 1;
        const w = grid.clientWidth || 1;
        const h = grid.clientHeight || 1;
        const gap = 8;
        const minCell = 70; // smallest an icon+label cell should shrink to
        const maxCols = Math.max(1, Math.floor((w + gap) / (minCell + gap)));

        let best = null;
        for (let cols = 1; cols <= maxCols; cols++) {
          const rows = Math.ceil(itemCount / cols);
          const cellW = (w - gap * (cols - 1)) / cols;
          const cellH = (h - gap * (rows - 1)) / rows;
          if (cellW < minCell || cellH < minCell * 0.75) continue;
          // Prefer the layout that wastes the least area on empty cells,
          // then the one with the least distorted (closest to square) cell.
          const emptyCells = rows * cols - itemCount;
          const aspect = Math.max(cellW / cellH, cellH / cellW);
          const score = emptyCells * 1000 + aspect;
          if (!best || score < best.score) best = { cols, rows, score };
        }
        if (!best) best = { cols: maxCols, rows: Math.ceil(itemCount / maxCols) };

        grid.style.setProperty('--req-picker-cols', best.cols);
        grid.style.setProperty('--req-picker-rows', best.rows);
      }

      // Shared cell builder for every picker grid (Captures/Abilities grid
      // and the Kingdom tab's Refights/Reaching Kingdoms sub-grids).
      function buildPickerCell(item, kind, kindClass) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'req-picker-item ' + kindClass;
        const selected = zs.requirements.some(r => r.kind === kind && r.key === item.key);
        cell.classList.toggle('selected', selected);
        if (kind === 'kingdoms' && item.color) cell.style.setProperty('--kingdom-color', item.color);
        if (kind === 'refights' && item.colors) {
          cell.style.setProperty('--refight-c1', item.colors[0]);
          cell.style.setProperty('--refight-c2', item.colors[1]);
        }
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.name;
        const label = document.createElement('span');
        label.textContent = item.name;
        cell.appendChild(img);
        cell.appendChild(label);
        cell.addEventListener('click', () => {
          bounce(cell);
          const nowSelected = toggleRequirement(zs, kind, item.key, noteArea);
          cell.classList.toggle('selected', nowSelected);
          onChange();
        });
        return cell;
      }

      function renderKingdomSections() {
        refightGrid.innerHTML = '';
        kingdomGrid.innerHTML = '';
        const q = search.value.trim().toLowerCase();
        const refights = q ? APC.REFIGHTS.filter(i => i.name.toLowerCase().includes(q)) : APC.REFIGHTS;
        const kingdoms = q ? APC.KINGDOMS.filter(i => i.name.toLowerCase().includes(q)) : APC.KINGDOMS;

        if (!refights.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          refightGrid.appendChild(empty);
        } else {
          refights.forEach(item => refightGrid.appendChild(buildPickerCell(item, 'refights', 'req-picker-item--refight')));
        }

        if (!kingdoms.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          kingdomGrid.appendChild(empty);
        } else {
          kingdoms.forEach(item => kingdomGrid.appendChild(buildPickerCell(item, 'kingdoms', 'req-picker-item--kingdom')));
        }
      }

      function renderGrid() {
        if (activeKind === 'kingdom') {
          grid.style.display = 'none';
          kingdomWrap.style.display = '';
          renderKingdomSections();
          return;
        }
        grid.style.display = '';
        kingdomWrap.style.display = 'none';

        grid.innerHTML = '';
        const list = activeKind === 'captures' ? APC.NOTES_CAPTURES : APC.NOTES_ABILITIES;
        const kindClass = activeKind === 'captures' ? 'req-picker-item--capture' : 'req-picker-item--ability';
        const q = search.value.trim().toLowerCase();
        const filtered = q ? list.filter(i => i.name.toLowerCase().includes(q)) : list;
        updateGridFit(filtered.length);
        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          grid.appendChild(empty);
          return;
        }
        filtered.forEach(item => grid.appendChild(buildPickerCell(item, activeKind, kindClass)));
      }

      const TAB_ORDER = ['captures', 'abilities', 'kingdom'];

      function setActiveTab(kind) {
        const fromIdx = TAB_ORDER.indexOf(activeKind);
        const toIdx = TAB_ORDER.indexOf(kind);
        const dir = toIdx > fromIdx ? 1 : -1;
        activeKind = kind;
        tabCaptures.classList.toggle('active', kind === 'captures');
        tabAbilities.classList.toggle('active', kind === 'abilities');
        tabKingdom.classList.toggle('active', kind === 'kingdom');
        renderGrid();
        const slideTarget = kind === 'kingdom' ? kingdomWrap : grid;
        slideTarget.style.setProperty('--tab-slide-from', (dir * 24) + 'px');
        slideTarget.classList.remove('tab-slide-in');
        void slideTarget.offsetWidth;
        slideTarget.classList.add('tab-slide-in');
      }
      tabCaptures.addEventListener('click', () => { bounce(tabCaptures); setActiveTab('captures'); });
      tabAbilities.addEventListener('click', () => { bounce(tabAbilities); setActiveTab('abilities'); });
      tabKingdom.addEventListener('click', () => { bounce(tabKingdom); setActiveTab('kingdom'); });
      search.addEventListener('input', renderGrid);

      renderGrid();
      document.body.appendChild(overlay);
      // clientWidth is 0 before the popup is in the DOM/laid out, so redo
      // the row math once it actually has real dimensions.
      requestAnimationFrame(renderGrid);
      const onResize = () => updateGridFit(grid.children.length);
      window.addEventListener('resize', onResize);

      function onKeyDown(e) {
        if (e.key === 'Escape') closePicker();
      }
      function closePicker() {
        overlay.classList.remove('active');
        document.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('resize', onResize);
        setTimeout(() => overlay.remove(), 320);
      }
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closePicker();
      });
      document.addEventListener('keydown', onKeyDown);

      // Force a reflow so the enter transition reliably triggers, then animate in.
      void overlay.offsetWidth;
      requestAnimationFrame(() => overlay.classList.add('active'));

      search.focus();
    }

    // ── Horizontal scroll (wheel / configurable mouse+key bindings) ──
    function setupScroll() {
      const scrollWrap = document.querySelector('.lz-scroll-wrap');
      if (!scrollWrap) return;

      scrollWrap.addEventListener('wheel', (e) => {
        if (scrollWrap.scrollWidth <= scrollWrap.clientWidth) return;
        e.preventDefault();
        const px = fullState.settings.notes_scroll_px || 100;
        scrollWrap.scrollTo({ left: scrollWrap.scrollLeft + (e.deltaY > 0 ? px : -px), behavior: 'smooth' });
      }, { passive: false });

      scrollWrap.addEventListener('mousedown', (e) => {
        const lb = fullState.settings.scroll_left_binding;
        const rb = fullState.settings.scroll_right_binding;
        if ((lb && lb.type === 'mouse' && e.button === lb.code) ||
            (rb && rb.type === 'mouse' && e.button === rb.code)) {
          e.preventDefault();
        }
      });
      scrollWrap.addEventListener('mouseup', (e) => {
        const px = fullState.settings.notes_scroll_px || 100;
        const lb = fullState.settings.scroll_left_binding;
        const rb = fullState.settings.scroll_right_binding;
        if (lb && lb.type === 'mouse' && e.button === lb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft - px, behavior: 'smooth' });
        } else if (rb && rb.type === 'mouse' && e.button === rb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft + px, behavior: 'smooth' });
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target && e.target.classList && e.target.classList.contains('zone-note')) return;
        const px = fullState.settings.notes_scroll_px || 100;
        const lb = fullState.settings.scroll_left_binding;
        const rb = fullState.settings.scroll_right_binding;
        if (lb && lb.type === 'key' && e.code === lb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft - px, behavior: 'smooth' });
        } else if (rb && rb.type === 'key' && e.code === rb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft + px, behavior: 'smooth' });
        }
      });
    }

    // ── Stay in sync with settings changed in the main tracker window ──
    // IMPORTANT: every keystroke here writes tracker_state, and the main
    // tracker tab can echo that write straight back (its Abilities & Captures
    // channel re-saves on any storage change). That echo fires a storage event
    // in THIS window carrying the very same settings. If we rebuild the DOM on
    // it, we destroy the textarea being typed in and drop focus after one
    // character. So: only rebuild when something that actually changes the
    // notes LAYOUT changed, and never yank focus out of a note mid-edit.
    const NOTES_LAYOUT_KEYS = [
      'notes_layout', 'notes_columns', 'notes_compact',
      'show_painting_notes', 'show_kingdom_moon', 'zone_names',
    ];

    window.addEventListener('storage', (e) => {
      if (e.key !== STATE_KEY || !e.newValue) return;

      let fresh;
      try { fresh = JSON.parse(e.newValue); } catch (err) { return; }
      if (!fresh || !fresh.settings) return;

      const prev = fullState.settings || {};
      const layoutChanged = NOTES_LAYOUT_KEYS.some(
        k => JSON.stringify(prev[k]) !== JSON.stringify(fresh.settings[k])
      );

      fullState.settings = fresh.settings;

      // Note-text echoes and unrelated writes (moons, captures, abilities)
      // don't touch our layout ignore them completely so typing is never
      // interrupted.
      if (!layoutChanged) return;

      // A real layout change happened. If the user is currently editing a
      // note, defer the rebuild until they leave the box so we don't steal
      // focus; otherwise rebuild now.
      const active = document.activeElement;
      if (active && active.classList && active.classList.contains('zone-note')) {
        applyNotesLayout(); // lightweight class toggles are focus-safe
        active.addEventListener('blur', function rebuildOnce() {
          active.removeEventListener('blur', rebuildOnce);
          buildLoadingZonesContent();
        }, { once: true });
        return;
      }

      buildLoadingZonesContent();
      applyNotesLayout();
    });

    // ── Init ────────────────────────────────────────────────────────
    document.getElementById('notes-page-clear').addEventListener('click', clearAllNotes);

    document.addEventListener('DOMContentLoaded', () => {
      loadFullState();
      ensureNotesToolbar();
      buildLoadingZonesContent();
      // layoutMasonryColumns();
      setupScroll();
    });
  </script>
</body>
</html>
