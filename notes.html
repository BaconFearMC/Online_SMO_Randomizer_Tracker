            // Shop was first picked as a requirement - that has to come out
            // too, or the note ends up with both ("Lost Shop AND Lost Shop
            // sells X & Y") since the "sells" sentence starts with that same
            // name text.
            if (noteArea) {
              const newText = saleText(sale);
              if (newText !== prevText) {
                if (prevText) {
                  removeRequirementText(noteArea, prevText);
                  if (newText) {
                    appendRequirementText(noteArea, newText);
                  } else {
                    // Deselecting a half here drops the note straight from
                    // the full sentence to nothing without this branch. The
                    // half that's still set needs its own text put back -
                    // "Shop sells Ability" if the Capture was the one just
                    // cleared (keeps "sells", which still refers to the
                    // Ability), or just "Shop Capture" if the Ability was
                    // the one just cleared ("sells" only ever describes the
                    // Ability half, so it has no meaning once that's gone).
                    // If both halves are now empty there's nothing to write
                    // back - the block below drops the Shop requirement and
                    // its bare name text entirely in that case.
                    const shopItem = APC.findItem('shops', shopKey);
                    if (shopItem && activeKind === 'captures' && sale.ability) {
                      const ablItem = APC.findItem('abilities', sale.ability);
                      if (ablItem) appendRequirementText(noteArea, shopItem.name + ' sells ' + ablItem.name);
                    } else if (shopItem && activeKind === 'abilities' && sale.capture) {
                      const capItem = APC.findItem('captures', sale.capture);
                      if (capItem) appendRequirementText(noteArea, shopItem.name + ' ' + capItem.name);
                    }
                  }
                } else if (newText && zs && zs.requirements.some(r => r.kind === 'shops' && r.key === shopKey)) {
                  const bareShopText = requirementDisplayText('shops', shopKey);
                  if (bareShopText) removeRequirementText(noteArea, bareShopText);
                  appendRequirementText(noteArea, newText);
                } else if (newText) {
                  appendRequirementText(noteArea, newText);
                }
              }
            }

            // Deselecting a half just clears it in place - no tab-jumping,
            // no auto-close, so a single click reliably removes it instead
            // of needing a second click to "catch up". But if that leaves
            // BOTH halves empty, the Shop itself is no longer configured as
            // anything - so drop it as this zone's requirement too (and its
            // "Shop" text), the same full removal a click on the Shop cell
            // itself would do, rather than leaving an empty Shop pick behind.
            if (alreadySelected) {
              if (!sale.capture && !sale.ability && zs) {
                const stillRequired = zs.requirements.some(r => r.kind === 'shops' && r.key === shopKey);
                if (stillRequired) {
                  const prevReqText = requirementDisplayText('shops', shopKey);
                  if (prevReqText) removeRequirementText(noteArea, prevReqText);
                  zs.requirements = zs.requirements.filter(r => !(r.kind === 'shops' && r.key === shopKey));
                }
              }
              render();
              if (onChange) onChange();
              return;
            }

            // Every Shop always has exactly 1 Capture + 1 Ability for sale
            // (see comment at the top of this function) - so walk the user
            // through both: picking one half while the other isn't set yet
            // auto-advances to that tab, instead of leaving them to notice
            // and click the second tab themselves.
            if (activeKind === 'captures' && !sale.ability) {
              setTab('abilities');
              if (onChange) onChange();
              return;
            }
            if (activeKind === 'abilities' && !sale.capture) {
              setTab('captures');
              if (onChange) onChange();
              return;
            }

            render();
            if (onChange) onChange();

            // Both halves are now set - the pairing is complete, so close
            // instead of leaving the user to notice and dismiss it manually.
            if (sale.capture && sale.ability) closePicker();
          });
          grid.appendChild(cell);
        });
      }

      function setTab(kind) {
        activeKind = kind;
        tabCaptures.classList.toggle('active', kind === 'captures');
        tabAbilities.classList.toggle('active', kind === 'abilities');
        render();
      }
      tabCaptures.addEventListener('click', () => { bounce(tabCaptures); setTab('captures'); });
      tabAbilities.addEventListener('click', () => { bounce(tabAbilities); setTab('abilities'); });
      search.addEventListener('input', render);

      document.body.appendChild(overlay);
      render();
      requestAnimationFrame(render);
      const onResize = () => render();
      window.addEventListener('resize', onResize);

      function onKeyDown(e) { if (e.key === 'Escape') closePicker(); }
      function closePicker() {
        overlay.classList.remove('active');
        document.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('resize', onResize);
        setTimeout(() => overlay.remove(), 320);
        if (onChange) onChange();
      }
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });
      document.addEventListener('keydown', onKeyDown);

      void overlay.offsetWidth;
      requestAnimationFrame(() => overlay.classList.add('active'));
      search.focus();
    }

    // ── Requirement Picker (replaces the old Kingdom Moon icon picker) ─
    // Two tabbed groups - Captures and Abilities, sourced from apc-data.js -
    // plus a quick-insert AND/OR/() toolbar for grouping. Picking an entry
    // adds its icon above the location and its name into the note text.
    // Presented as a fullscreen overlay (same fade+pop-in language as the
    // Dark Side map lightbox above) with a big, easy-to-click icon grid.
    function openRequirementPicker(event, zs, noteArea, onChange) {
      document.querySelectorAll('.req-picker-overlay').forEach(p => p.remove());

      const overlay = document.createElement('div');
      overlay.className = 'req-picker-overlay';

      const popup = document.createElement('div');
      popup.className = 'req-picker-popup';
      popup.addEventListener('click', (e) => e.stopPropagation());
      overlay.appendChild(popup);

      const header = document.createElement('div');
      header.className = 'req-picker-header';
      const title = document.createElement('div');
      title.className = 'req-picker-title';
      title.textContent = 'Add a Requirement';
      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'req-picker-close';
      closeBtn.textContent = '✕';
      closeBtn.title = 'Close';
      closeBtn.addEventListener('click', () => closePicker());
      header.appendChild(title);
      header.appendChild(closeBtn);
      popup.appendChild(header);

      const toolbar = document.createElement('div');
      toolbar.className = 'req-picker-toolbar';
      const TOK_CLASS = { AND: 'req-picker-tok--and', OR: 'req-picker-tok--or', '(': 'req-picker-tok--paren', ')': 'req-picker-tok--paren' };
      ['AND', 'OR', '(', ')'].forEach(tok => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = tok;
        btn.title = 'Insert ' + tok + ' into the note';
        if (TOK_CLASS[tok]) btn.classList.add(TOK_CLASS[tok]);
        btn.addEventListener('click', () => insertNoteToken(noteArea, tok));
        toolbar.appendChild(btn);
      });
      popup.appendChild(toolbar);

      const tabs = document.createElement('div');
      tabs.className = 'req-picker-tabs';
      const tabCaptures = document.createElement('button');
      tabCaptures.type = 'button';
      tabCaptures.className = 'req-picker-tab req-picker-tab--capture active';
      tabCaptures.textContent = 'Captures';
      const tabAbilities = document.createElement('button');
      tabAbilities.type = 'button';
      tabAbilities.className = 'req-picker-tab req-picker-tab--ability';
      tabAbilities.textContent = 'Abilities';
      const tabKingdom = document.createElement('button');
      tabKingdom.type = 'button';
      tabKingdom.className = 'req-picker-tab req-picker-tab--kingdom';
      tabKingdom.textContent = 'Kingdom';
      tabs.appendChild(tabCaptures);
      tabs.appendChild(tabAbilities);
      tabs.appendChild(tabKingdom);
      popup.appendChild(tabs);

      const search = document.createElement('input');
      search.type = 'text';
      search.className = 'req-picker-search';
      search.placeholder = 'Search…';
      popup.appendChild(search);

      // Captures tab: a wrapper holding the regular grid on the left and a
      // "One-Time Captures" column on the right, past a divider line. The
      // wrapper is reused (not rebuilt) across tab switches; the one-time
      // column is just hidden for Abilities/Kingdom.
      const capturesWrap = document.createElement('div');
      capturesWrap.className = 'req-picker-captures-wrap';
      popup.appendChild(capturesWrap);

      const grid = document.createElement('div');
      grid.className = 'req-picker-grid';
      capturesWrap.appendChild(grid);

      const onetimeCol = document.createElement('div');
      onetimeCol.className = 'req-picker-onetime-col';
      const onetimeTitle = document.createElement('div');
      onetimeTitle.className = 'req-picker-onetime-title';
      onetimeTitle.textContent = 'One-Time Captures';
      const onetimeGrid = document.createElement('div');
      onetimeGrid.className = 'req-picker-grid req-picker-grid--onetime';
      onetimeCol.appendChild(onetimeTitle);
      onetimeCol.appendChild(onetimeGrid);
      capturesWrap.appendChild(onetimeCol);

      // Kingdom tab: three side-by-side sections instead of the single grid -
      // Refights, Shops, and Reaching Kingdoms.
      const kingdomWrap = document.createElement('div');
      kingdomWrap.className = 'req-picker-kingdom-wrap';
      kingdomWrap.style.display = 'none';

      const refightCol = document.createElement('div');
      refightCol.className = 'req-picker-kingdom-col';
      const refightTitle = document.createElement('div');
      refightTitle.className = 'req-picker-kingdom-col-title';
      refightTitle.innerHTML = 'Refight <span class="req-picker-kingdom-col-hint">(only one applies)</span>';
      const refightGrid = document.createElement('div');
      refightGrid.className = 'req-picker-grid req-picker-grid--sub';
      refightGrid.id = 'refight-grid-force-3x2';
      refightCol.appendChild(refightTitle);
      refightCol.appendChild(refightGrid);

      // Each kingdom's shop, its own kind ('shops') distinct from the
      // kingdom itself - so searching "Lake Shop" only ever matches the
      // Lake Shop button here, never the Lake kingdom button over in the
      // Reaching Kingdoms column (they're separate items, separate grids).
      const shopCol = document.createElement('div');
      shopCol.className = 'req-picker-kingdom-col';
      const shopTitle = document.createElement('div');
      shopTitle.className = 'req-picker-kingdom-col-title';
      shopTitle.innerHTML = 'Shop <span class="req-picker-kingdom-col-hint">(only one applies)</span>';
      const shopGrid = document.createElement('div');
      shopGrid.className = 'req-picker-grid req-picker-grid--sub';
      shopGrid.id = 'shop-grid-force-3x3';
      shopCol.appendChild(shopTitle);
      shopCol.appendChild(shopGrid);

      const kingdomCol = document.createElement('div');
      kingdomCol.className = 'req-picker-kingdom-col';
      const kingdomTitle = document.createElement('div');
      kingdomTitle.className = 'req-picker-kingdom-col-title';
      kingdomTitle.textContent = 'Reaching Kingdoms';
      const kingdomGrid = document.createElement('div');
      kingdomGrid.className = 'req-picker-grid req-picker-grid--sub';
      kingdomCol.appendChild(kingdomTitle);
      kingdomCol.appendChild(kingdomGrid);

      // ── Find Entries (Kingdom tab) ───────────────────────────────────
      // One button - no duplicate button list. Click "Find", the existing
      // Refight/Shop/Kingdom buttons below shake and dim slightly, then
      // clicking one of THOSE (instead of adding a second set of buttons
      // above them) pops up every zone that has it picked as a requirement.
      let findModeActive = false;

      const findBtn = document.createElement('button');
      findBtn.type = 'button';
      findBtn.className = 'req-picker-find-btn';
      findBtn.textContent = '🔍';
      findBtn.title = 'Find';

      function setFindMode(active) {
        findModeActive = active;
        findBtn.classList.toggle('active', active);
        findBtn.title = active ? 'Tap a button below…' : 'Find';
        applyFindTargetStyling();
      }

      // Marks/unmarks the already-existing picker cells (not a new set of
      // buttons) so they shake + turn ~10% grey while find mode is on.
      // Re-run after every renderKingdomSections() rebuild too, since that
      // wipes and rebuilds the grids from scratch (e.g. on search).
      function applyFindTargetStyling() {
        [refightGrid, shopGrid, kingdomGrid].forEach(g => {
          g.querySelectorAll('.req-picker-item').forEach(cell => {
            cell.classList.toggle('req-picker-item--find-target', findModeActive);
          });
        });
      }

      findBtn.addEventListener('click', () => {
        bounce(findBtn);
        setFindMode(!findModeActive);
      });

      // Pops up every zone that has this Refight/Shop/Kingdom picked as a
      // requirement (or, for a Kingdom, how to reach it). Tinted with the
      // clicked item's own color, with each result row further tinted by
      // that particular zone's kingdom color (e.g. a Snow zone's row reads
      // orange, since Snow's kingdom color is orange).
      function showFindResultsPopup(kind, key) {
        const item = APC.findItem(kind, key);
        if (!item) return;
        document.querySelectorAll('.req-find-popup-overlay').forEach(p => p.remove());

        // Kingdoms carry item.color directly; Refights/Shops carry a
        // [c1, c2] pair (see .req-picker-item--shop above) - c1 reads as
        // "this item's" color. Anything else falls back to a neutral grey.
        const popupColor =
          (kind === 'kingdoms' && item.color) ? item.color :
          ((kind === 'refights' || kind === 'shops') && item.colors) ? item.colors[0] :
          '#8a8a96';

        const popOverlay = document.createElement('div');
        popOverlay.className = 'req-find-popup-overlay';
        const pop = document.createElement('div');
        pop.className = 'req-find-popup';
        pop.style.setProperty('--popup-color', popupColor);
        pop.addEventListener('click', (e) => e.stopPropagation());
        popOverlay.appendChild(pop);

        const questionText =
          kind === 'kingdoms' ? 'How do I reach ' + item.name + ' Kingdom?' :
          'Which Loading Zone has the ' + item.name + '?';
        const emptyText =
          kind === 'kingdoms'
            ? 'No loading zone is tagged with this kingdom yet. On a zone in the main Notes view, use its + button → Kingdom tab to pick ' + item.name + '.'
            : 'No loading zone has ' + item.name + ' picked as a requirement yet. Add it to a zone via its + button in the main Notes view.';

        const head = document.createElement('div');
        head.className = 'req-find-popup-head';
        const headIcon = document.createElement('img');
        headIcon.className = 'req-find-popup-head-icon';
        headIcon.src = item.src;
        headIcon.alt = item.name;
        const label = document.createElement('div');
        label.className = 'req-find-popup-head-text';
        label.textContent = questionText;
        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'req-find-popup-close';
        closeBtn.textContent = '✕';
        closeBtn.title = 'Close';
        closeBtn.addEventListener('click', () => closeFindPopup());
        head.appendChild(headIcon);
        head.appendChild(label);
        head.appendChild(closeBtn);
        pop.appendChild(head);

        const lines = kind === 'kingdoms' ? buildReachLines(key) : buildRequirementLines(kind, key);
        const body = document.createElement('div');
        body.className = 'req-find-popup-body';
        if (lines.length) {
          lines.forEach(line => {
            const row = document.createElement('div');
            row.className = 'req-picker-reach-line';
            row.style.setProperty('--line-color', line.fromColor || popupColor);

            // From icon (left): the zone's own kingdom.
            if (line.fromIcon) {
              const fromImg = document.createElement('img');
              fromImg.className = 'req-picker-reach-line-icon req-picker-reach-line-icon--from';
              fromImg.src = line.fromIcon;
              fromImg.alt = line.kingdomLabel;
              row.appendChild(fromImg);
            }

            const text = document.createElement('span');
            text.className = 'req-picker-reach-line-text';
            const kingdomSpan = document.createElement('span');
            kingdomSpan.className = 'req-picker-reach-line-kingdom';
            kingdomSpan.textContent = ' (' + line.kingdomLabel + ')';
            text.textContent = line.fromLabel;
            text.appendChild(kingdomSpan);
            row.appendChild(text);

            const arrow = document.createElement('span');
            arrow.className = 'req-picker-reach-line-arrow';
            arrow.textContent = '→';
            row.appendChild(arrow);

            // To icon (right): the requirement/target itself.
            if (line.toIcon) {
              const toImg = document.createElement('img');
              toImg.className = 'req-picker-reach-line-icon req-picker-reach-line-icon--to';
              toImg.src = line.toIcon;
              toImg.alt = line.toLabel;
              row.appendChild(toImg);
            }

            body.appendChild(row);
          });
        } else {
          const empty = document.createElement('div');
          empty.className = 'req-picker-reach-empty';
          empty.textContent = emptyText;
          body.appendChild(empty);
        }
        pop.appendChild(body);

        document.body.appendChild(popOverlay);

        function onPopKeyDown(e) { if (e.key === 'Escape') closeFindPopup(); }
        function closeFindPopup() {
          popOverlay.classList.remove('active');
          document.removeEventListener('keydown', onPopKeyDown);
          setTimeout(() => popOverlay.remove(), 300);
        }
        popOverlay.addEventListener('click', (e) => { if (e.target === popOverlay) closeFindPopup(); });
        document.addEventListener('keydown', onPopKeyDown);

        void popOverlay.offsetWidth;
        requestAnimationFrame(() => popOverlay.classList.add('active'));
      }

      kingdomWrap.appendChild(findBtn);
      kingdomWrap.appendChild(refightCol);
      kingdomWrap.appendChild(shopCol);
      kingdomWrap.appendChild(kingdomCol);
      popup.appendChild(kingdomWrap);

      let activeKind = 'captures';

      // Computes a rows x cols grid that (a) has at least itemCount cells,
      // (b) fills the box's actual width/height with no leftover gap, and
      // (c) keeps cells reasonably icon-shaped rather than very long
      // slivers. Re-run whenever the item count or box size changes, so
      // adding more captures/abilities later never requires a manual tweak.
      function updateGridFit(itemCount) {
        if (!itemCount) itemCount = 1;
        const w = grid.clientWidth || 1;
        const h = grid.clientHeight || 1;
        const gap = 8;
        const minCell = 70; // smallest an icon+label cell should shrink to
        const maxCols = Math.max(1, Math.floor((w + gap) / (minCell + gap)));

        let best = null;
        for (let cols = 1; cols <= maxCols; cols++) {
          const rows = Math.ceil(itemCount / cols);
          const cellW = (w - gap * (cols - 1)) / cols;
          const cellH = (h - gap * (rows - 1)) / rows;
          if (cellW < minCell || cellH < minCell * 0.75) continue;
          // Prefer the layout that wastes the least area on empty cells,
          // then the one with the least distorted (closest to square) cell.
          const emptyCells = rows * cols - itemCount;
          const aspect = Math.max(cellW / cellH, cellH / cellW);
          const score = emptyCells * 1000 + aspect;
          if (!best || score < best.score) best = { cols, rows, score };
        }
        if (!best) best = { cols: maxCols, rows: Math.ceil(itemCount / maxCols) };

        grid.style.setProperty('--req-picker-cols', best.cols);
        grid.style.setProperty('--req-picker-rows', best.rows);
      }

      // Shared cell builder for every picker grid (Captures/Abilities grid
      // and the Kingdom tab's Refights/Reaching Kingdoms sub-grids).
      function buildPickerCell(item, kind, kindClass) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'req-picker-item ' + kindClass;
        const selected = zs.requirements.some(r => r.kind === kind && r.key === item.key);
        cell.classList.toggle('selected', selected);
        if (kind === 'kingdoms' && item.color) cell.style.setProperty('--kingdom-color', item.color);
        if ((kind === 'refights' || kind === 'shops') && item.colors) {
          cell.style.setProperty('--refight-c1', item.colors[0]);
          cell.style.setProperty('--refight-c2', item.colors[1]);
        }
        const img = document.createElement('img');
        img.alt = item.name;
        img.addEventListener('error', () => {
          // Real 404/missing file: img has zero intrinsic size, so without
          // this it silently disappears (worst in the one-time grid's
          // min-content rows - see .req-picker-grid--onetime .req-picker-item
          // min-height above). Flag it visibly instead of hiding the problem.
          cell.classList.add('req-picker-item--broken-icon');
          console.warn('[req-picker] missing icon for', item.key, '->', item.src);
        }, { once: true });
        img.src = item.src;
        const label = document.createElement('span');
        label.textContent = item.name;
        cell.appendChild(img);
        cell.appendChild(label);
        // A Shop's paired kingdom icon rides alongside its shop.png icon,
        // exactly like a Refight's paired Capture/Ability icon.
        if (kind === 'shops' && item.pair) {
          const pairItem = APC.findItem(item.pair.kind, item.pair.key);
          if (pairItem) {
            const pairImg = document.createElement('img');
            pairImg.className = 'req-picker-item-pair-icon';
            pairImg.src = pairItem.src;
            pairImg.alt = pairItem.name;
            cell.appendChild(pairImg);
          }
        }

        // Every Shop always has exactly 1 Capture + 1 Ability for sale. A
        // small tag button opens that picker any time (edit), independent
        // of whether this Shop is currently picked as the zone's
        // requirement; the cell's tooltip reflects whatever's set.
        let refreshSaleTitle = null;
        if (kind === 'shops') {
          refreshSaleTitle = function () {
            const sale = APC.getShopSale(fullState, item.key);
            const capItem = sale.capture ? APC.findItem('captures', sale.capture) : null;
            const ablItem = sale.ability ? APC.findItem('abilities', sale.ability) : null;
            const bits = [];
            if (ablItem) bits.push(ablItem.name);
            if (capItem) bits.push(capItem.name);
            cell.title = item.name + (bits.length ? (' — sells ' + bits.join(' & ')) : ' (click 🏷 to set what it sells)');
          };
          refreshSaleTitle();

          const saleBtn = document.createElement('button');
          saleBtn.type = 'button';
          saleBtn.className = 'req-picker-item-sale-btn';
          saleBtn.textContent = '🏷';
          saleBtn.title = 'Set the Capture & Ability for sale here';
          saleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            bounce(saleBtn);
            openShopSalePicker(item.key, refreshSaleTitle, noteArea, zs);
          });
          cell.appendChild(saleBtn);
        }

        cell.addEventListener('click', () => {
          // Find mode repurposes this same, already-on-screen button: a
          // click looks the item up instead of adding/removing it as a
          // requirement on the currently open zone.
          if (findModeActive && (kind === 'refights' || kind === 'shops' || kind === 'kingdoms')) {
            setFindMode(false);
            showFindResultsPopup(kind, item.key);
            return;
          }
          bounce(cell);
          // A zone only ever has exactly one real Refight and one real Shop
          // leading into it in-game (unlike Captures/Abilities/Reaching
          // Kingdoms, where several can genuinely be required together), so
          // these two behave like a radio group: picking a new one clears
          // out any previous pick of the same kind instead of stacking.
          const already = zs.requirements.some(r => r.kind === kind && r.key === item.key);

          if (kind === 'shops' && already) {
            // Deselecting the currently-picked Shop removes everything it
            // brought with it - its own "Shop" text, its "sells" sentence,
            // and the underlying sale data - not just the requirement.
            // Removing only the Capture or only the Ability half (via the
            // sale picker) must never do this; only clicking the Shop cell
            // itself, with nothing left dangling, counts as full removal.
            const sale = APC.getShopSale(fullState, item.key);
            const saleTxt = shopSaleDisplayText(item.key, sale);
            if (saleTxt) removeRequirementText(noteArea, saleTxt);
            APC.setShopSale(fullState, item.key, 'captures', null);
            APC.setShopSale(fullState, item.key, 'abilities', null);
            saveFullState();
          }

          // A zone only ever has exactly one real Refight and one real Shop
          // leading into it in-game (unlike Captures/Abilities/Reaching
          // Kingdoms, where several can genuinely be required together), so
          // these two behave like a radio group: picking a new one clears
          // out any previous pick of the same kind instead of stacking.
          if (kind === 'refights' || kind === 'shops') {
            if (!already) {
              zs.requirements
                .filter(r => r.kind === kind)
                .forEach(r => {
                  // A Shop being swapped out also had its "sells" sentence
                  // written into the note - that has to go first, since it
                  // starts with the same name text removeRequirementText is
                  // about to search for next (leaving it for last risks
                  // matching inside "X Shop sells A & B" instead of the
                  // standalone "X Shop").
                  if (r.kind === 'shops') {
                    const sale = APC.getShopSale(fullState, r.key);
                    const saleTxt = shopSaleDisplayText(r.key, sale);
                    if (saleTxt) removeRequirementText(noteArea, saleTxt);
                    APC.setShopSale(fullState, r.key, 'captures', null);
                    APC.setShopSale(fullState, r.key, 'abilities', null);
                    saveFullState();
                  }
                  const prevText = requirementDisplayText(r.kind, r.key);
                  if (prevText) removeRequirementText(noteArea, prevText);
                });
              zs.requirements = zs.requirements.filter(r => r.kind !== kind);
              const siblingGrid = kind === 'refights' ? refightGrid : shopGrid;
              siblingGrid.querySelectorAll('.req-picker-item.selected').forEach(el => el.classList.remove('selected'));
            }
          }
          const nowSelected = toggleRequirement(zs, kind, item.key, noteArea);
          cell.classList.toggle('selected', nowSelected);
          onChange();

          // First time this Shop gets picked as a requirement, prompt for
          // what it sells right away (a real shop always has exactly 1
          // Capture + 1 Ability for sale). Already-configured shops aren't
          // re-prompted here - use the 🏷 button to edit those any time.
          // Either way, picking a Shop here is done with this picker - the
          // sale popup (if any) takes over, so close this one out instead
          // of leaving it sitting open underneath.
          if (kind === 'shops' && nowSelected) {
            const sale = APC.getShopSale(fullState, item.key);
            if (!sale.capture && !sale.ability) {
              openShopSalePicker(item.key, refreshSaleTitle, noteArea, zs);
            }
            closePicker();
          } else if (kind === 'shops' && !nowSelected) {
            refreshSaleTitle();
            closePicker();
          }
        });
        return cell;
      }

      function renderKingdomSections() {
        refightGrid.innerHTML = '';
        shopGrid.innerHTML = '';
        kingdomGrid.innerHTML = '';
        const q = search.value.trim().toLowerCase();
        const refights = q ? APC.REFIGHTS.filter(i => i.name.toLowerCase().includes(q)) : APC.REFIGHTS;
        // Matched against each shop's own full name (e.g. "Lake Shop"), so a
        // search never falls back to matching the kingdom it belongs to.
        // Painting-menu-only shops (Cap/Cascade/Wooded/Seaside) are left out
        // here - they're not real zone gates, so they only ever show up in
        // the Paintings column itself (see PAINTING_SHOP_KINGDOMS above).
        const shops = (q ? APC.SHOPS.filter(i => i.name.toLowerCase().includes(q)) : APC.SHOPS)
          .filter(i => !i.paintingOnly);
        const kingdoms = q ? APC.KINGDOMS.filter(i => i.name.toLowerCase().includes(q)) : APC.KINGDOMS;

        if (!refights.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          refightGrid.appendChild(empty);
        } else {
          refights.forEach(item => refightGrid.appendChild(buildPickerCell(item, 'refights', 'req-picker-item--refight')));
        }

        if (!shops.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          shopGrid.appendChild(empty);
        } else {
          shops.forEach(item => shopGrid.appendChild(buildPickerCell(item, 'shops', 'req-picker-item--shop')));
        }

        if (!kingdoms.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          kingdomGrid.appendChild(empty);
        } else {
          kingdoms.forEach(item => kingdomGrid.appendChild(buildPickerCell(item, 'kingdoms', 'req-picker-item--kingdom')));
        }

        applyFindTargetStyling();
      }

      function buildOnetimeGrid() {
        onetimeGrid.innerHTML = '';
        const q = search.value.trim().toLowerCase();
        const list = APC.NOTES_CAPTURES_ONETIME;
        const filtered = q ? list.filter(i => i.name.toLowerCase().includes(q)) : list;
        filtered.forEach(item => onetimeGrid.appendChild(buildPickerCell(item, 'captures', 'req-picker-item--capture')));
        const coinMatches = !q || 'coin grind'.includes(q) || 'snow coin grind'.includes(q) ||
          'cascade coin grind'.includes(q) || 'wooded coin grind'.includes(q);
        if (coinMatches) onetimeGrid.appendChild(buildCoinGrindCell());
        if (!filtered.length && !coinMatches) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          onetimeGrid.appendChild(empty);
        }
      }

      // Coin Grind isn't a single capture - it's a tile that opens a small
      // submenu (Snow / Cascade / Wooded), each toggling the requirement
      // that actually gates that kingdom's coin grind. Cascade and Wooded
      // "say and show" T-Rex / Uproot respectively, since that's the real
      // requirement in-game; Snow uses the generic Coin Grind capture.
      const COIN_GRIND_OPTIONS = [
        { label: 'Snow Coin Grind',    kind: 'captures', key: 'Coin_Grind_Capture' },
        { label: 'Cascade Coin Grind', kind: 'captures', key: 'T-Rex_Capture' },
        { label: 'Wooded Coin Grind',  kind: 'captures', key: 'Uproot_Capture' },
      ];

      function buildCoinGrindCell() {
        const coinItem = APC.findItem('captures', 'Coin_Grind_Capture');
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'req-picker-item req-picker-item--capture req-picker-item--coingrind';
        const img = document.createElement('img');
        img.src = coinItem ? coinItem.src : 'assets/capture/Coin.png';
        img.alt = 'Coin Grind';
        const label = document.createElement('span');
        label.textContent = 'Coin Grind';
        cell.appendChild(img);
        cell.appendChild(label);

        function refreshSelected() {
          const anySelected = COIN_GRIND_OPTIONS.some(o =>
            zs.requirements.some(r => r.kind === o.kind && r.key === o.key));
          cell.classList.toggle('selected', anySelected);
        }
        refreshSelected();

        cell.addEventListener('click', (e) => {
          e.stopPropagation();
          bounce(cell);
          openCoinGrindSubmenu(cell, refreshSelected);
        });
        return cell;
      }

      function openCoinGrindSubmenu(anchorEl, onDone) {
        document.querySelectorAll('.req-picker-coingrind-submenu').forEach(m => m.remove());
        const menu = document.createElement('div');
        menu.className = 'req-picker-coingrind-submenu';
        document.body.appendChild(menu);

        COIN_GRIND_OPTIONS.forEach(opt => {
          const shows = APC.findItem(opt.kind, opt.key);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'req-picker-coingrind-opt';
          const selected = zs.requirements.some(r => r.kind === opt.kind && r.key === opt.key);
          btn.classList.toggle('selected', selected);
          const img = document.createElement('img');
          img.src = shows ? shows.src : '';
          img.alt = opt.label;
          const text = document.createElement('span');
          text.textContent = opt.label;
          if (shows && opt.key !== 'Coin_Grind_Capture') {
            const sub = document.createElement('span');
            sub.className = 'req-picker-coingrind-opt-sub';
            sub.textContent = shows.name;
            text.appendChild(sub);
          }
          btn.appendChild(img);
          btn.appendChild(text);
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            bounce(btn);
            const nowSelected = toggleRequirement(zs, opt.kind, opt.key, noteArea);
            btn.classList.toggle('selected', nowSelected);
            onChange();
            if (onDone) onDone();
          });
          menu.appendChild(btn);
        });

        const rect = anchorEl.getBoundingClientRect();
        menu.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
        menu.style.top = (rect.bottom + 6) + 'px';

        function onDocClick(e) {
          if (!menu.contains(e.target) && e.target !== anchorEl) closeMenu();
        }
        function onKeyDown(e) { if (e.key === 'Escape') closeMenu(); }
        function closeMenu() {
          menu.classList.remove('active');
          document.removeEventListener('click', onDocClick, true);
          document.removeEventListener('keydown', onKeyDown);
          setTimeout(() => menu.remove(), 200);
        }
        setTimeout(() => document.addEventListener('click', onDocClick, true), 0);
        document.addEventListener('keydown', onKeyDown);

        void menu.offsetWidth;
        requestAnimationFrame(() => menu.classList.add('active'));
      }

      function renderGrid() {
        if (activeKind === 'kingdom') {
          capturesWrap.style.display = 'none';
          kingdomWrap.style.display = '';
          renderKingdomSections();
          return;
        }
        capturesWrap.style.display = '';
        kingdomWrap.style.display = 'none';
        onetimeCol.style.display = activeKind === 'captures' ? '' : 'none';

        grid.innerHTML = '';
        const list = activeKind === 'captures' ? APC.NOTES_CAPTURES : APC.NOTES_ABILITIES;
        const kindClass = activeKind === 'captures' ? 'req-picker-item--capture' : 'req-picker-item--ability';
        const q = search.value.trim().toLowerCase();
        const filtered = q ? list.filter(i => i.name.toLowerCase().includes(q)) : list;
        updateGridFit(filtered.length);
        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'req-picker-empty';
          empty.textContent = 'No matches';
          grid.appendChild(empty);
        } else {
          filtered.forEach(item => grid.appendChild(buildPickerCell(item, activeKind, kindClass)));
        }

        if (activeKind === 'captures') buildOnetimeGrid();
      }

      const TAB_ORDER = ['captures', 'abilities', 'kingdom'];

      function setActiveTab(kind) {
        const fromIdx = TAB_ORDER.indexOf(activeKind);
        const toIdx = TAB_ORDER.indexOf(kind);
        const dir = toIdx > fromIdx ? 1 : -1;
        activeKind = kind;
        if (kind !== 'kingdom' && findModeActive) setFindMode(false);
        tabCaptures.classList.toggle('active', kind === 'captures');
        tabAbilities.classList.toggle('active', kind === 'abilities');
        tabKingdom.classList.toggle('active', kind === 'kingdom');
        renderGrid();
        const slideTarget = kind === 'kingdom' ? kingdomWrap : capturesWrap;
        slideTarget.style.setProperty('--tab-slide-from', (dir * 24) + 'px');
        slideTarget.classList.remove('tab-slide-in');
        void slideTarget.offsetWidth;
        slideTarget.classList.add('tab-slide-in');
      }
      tabCaptures.addEventListener('click', () => { bounce(tabCaptures); setActiveTab('captures'); });
      tabAbilities.addEventListener('click', () => { bounce(tabAbilities); setActiveTab('abilities'); });
      tabKingdom.addEventListener('click', () => { bounce(tabKingdom); setActiveTab('kingdom'); });
      search.addEventListener('input', renderGrid);

      renderGrid();
      document.body.appendChild(overlay);
      // clientWidth is 0 before the popup is in the DOM/laid out, so redo
      // the row math once it actually has real dimensions.
      requestAnimationFrame(renderGrid);
      const onResize = () => updateGridFit(grid.children.length);
      window.addEventListener('resize', onResize);

      function onKeyDown(e) {
        // If the "for sale" sub-picker is currently open on top of this one
        // (see openShopSalePicker), let its own Escape handler close that
        // instead - otherwise both close at once and this picker vanishes
        // out from under the sale popup while it's still on screen.
        if (e.key === 'Escape' && !document.querySelector('.req-picker-overlay--sale')) closePicker();
      }
      function closePicker() {
        overlay.classList.remove('active');
        document.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('resize', onResize);
        setTimeout(() => overlay.remove(), 320);
      }
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closePicker();
      });
      document.addEventListener('keydown', onKeyDown);

      // Force a reflow so the enter transition reliably triggers, then animate in.
      void overlay.offsetWidth;
      requestAnimationFrame(() => overlay.classList.add('active'));

      search.focus();
    }

    // ── Horizontal scroll (wheel / configurable mouse+key bindings) ──
    function setupScroll() {
      const scrollWrap = document.querySelector('.lz-scroll-wrap');
      if (!scrollWrap) return;

      scrollWrap.addEventListener('wheel', (e) => {
        if (scrollWrap.scrollWidth <= scrollWrap.clientWidth) return;
        e.preventDefault();
        const px = fullState.settings.notes_scroll_px || 100;
        scrollWrap.scrollTo({ left: scrollWrap.scrollLeft + (e.deltaY > 0 ? px : -px), behavior: 'smooth' });
      }, { passive: false });

      scrollWrap.addEventListener('mousedown', (e) => {
        const lb = fullState.settings.scroll_left_binding;
        const rb = fullState.settings.scroll_right_binding;
        if ((lb && lb.type === 'mouse' && e.button === lb.code) ||
            (rb && rb.type === 'mouse' && e.button === rb.code)) {
          e.preventDefault();
        }
      });
      scrollWrap.addEventListener('mouseup', (e) => {
        const px = fullState.settings.notes_scroll_px || 100;
        const lb = fullState.settings.scroll_left_binding;
        const rb = fullState.settings.scroll_right_binding;
        if (lb && lb.type === 'mouse' && e.button === lb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft - px, behavior: 'smooth' });
        } else if (rb && rb.type === 'mouse' && e.button === rb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft + px, behavior: 'smooth' });
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target && e.target.classList && e.target.classList.contains('zone-note')) return;
        const px = fullState.settings.notes_scroll_px || 100;
        const lb = fullState.settings.scroll_left_binding;
        const rb = fullState.settings.scroll_right_binding;
        if (lb && lb.type === 'key' && e.code === lb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft - px, behavior: 'smooth' });
        } else if (rb && rb.type === 'key' && e.code === rb.code) {
          e.preventDefault();
          scrollWrap.scrollTo({ left: scrollWrap.scrollLeft + px, behavior: 'smooth' });
        }
      });
    }

    // ── Stay in sync with settings changed in the main tracker window ──
    // IMPORTANT: every keystroke here writes tracker_state, and the main
    // tracker tab can echo that write straight back (its Abilities & Captures
    // channel re-saves on any storage change). That echo fires a storage event
    // in THIS window carrying the very same settings. If we rebuild the DOM on
    // it, we destroy the textarea being typed in and drop focus after one
    // character. So: only rebuild when something that actually changes the
    // notes LAYOUT changed, and never yank focus out of a note mid-edit.
    const NOTES_LAYOUT_KEYS = [
      'notes_layout', 'notes_columns', 'notes_compact',
      'show_painting_notes', 'show_kingdom_moon', 'zone_names',
    ];

    window.addEventListener('storage', (e) => {
      if (e.key !== STATE_KEY || !e.newValue) return;

      let fresh;
      try { fresh = JSON.parse(e.newValue); } catch (err) { return; }
      if (!fresh || !fresh.settings) return;

      const prev = fullState.settings || {};
      const layoutChanged = NOTES_LAYOUT_KEYS.some(
        k => JSON.stringify(prev[k]) !== JSON.stringify(fresh.settings[k])
      );

      fullState.settings = fresh.settings;

      // Note-text echoes and unrelated writes (moons, captures, abilities)
      // don't touch our layout ignore them completely so typing is never
      // interrupted.
      if (!layoutChanged) return;

      // A real layout change happened. If the user is currently editing a
      // note, defer the rebuild until they leave the box so we don't steal
      // focus; otherwise rebuild now.
      const active = document.activeElement;
      if (active && active.classList && active.classList.contains('zone-note')) {
        applyNotesLayout(); // lightweight class toggles are focus-safe
        active.addEventListener('blur', function rebuildOnce() {
          active.removeEventListener('blur', rebuildOnce);
          buildLoadingZonesContent();
        }, { once: true });
        return;
      }

      buildLoadingZonesContent();
      applyNotesLayout();
    });

    // ── Init ────────────────────────────────────────────────────────
    document.getElementById('notes-page-clear').addEventListener('click', clearAllNotes);

    document.addEventListener('DOMContentLoaded', () => {
      loadFullState();
      ensureNotesToolbar();
      buildLoadingZonesContent();
      // layoutMasonryColumns();
      setupScroll();
    });
  </script>
</body>
</html>
