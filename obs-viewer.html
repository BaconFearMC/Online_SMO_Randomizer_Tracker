<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker Mirror</title>
<style>
  :root { --dot: 16px; --dot-color: #ff3b5c; --letterbox: #0b0b10; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--letterbox); font-family: system-ui, "Segoe UI", sans-serif; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; visibility: hidden; background: #111; }
  #frame { border: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .3s; will-change: transform; }
  #cursor.show { opacity: 1; }
  #cursor i { position: absolute; left: calc(var(--dot) / -2); top: calc(var(--dot) / -2);
    width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--dot-color);
    box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 2px 10px rgba(0,0,0,.55);
    transition: transform .09s ease-out; }
  #cursor.down i { transform: scale(.7); }

  .ripple { position: absolute; width: var(--dot); height: var(--dot); margin: calc(var(--dot) / -2) 0 0 calc(var(--dot) / -2);
    border-radius: 50%; border: 3px solid var(--rc, #fff); box-sizing: border-box;
    animation: ripple .55s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.8); opacity: .95; } to { transform: scale(3.4); opacity: 0; } }

  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #cfd0dc; text-align: center; background: rgba(11,11,16,.88); transition: opacity .35s; }
  #status.hide { opacity: 0; pointer-events: none; }
  #status .ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #ff3b5c; animation: spin 1s linear infinite; }
  #status h1 { margin: 0; font-size: 18px; font-weight: 650; }
  #status p { margin: 0; font-size: 13px; opacity: .65; max-width: 420px; line-height: 1.5; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.noui #status { display: none; }
</style>
</head>
<body>
<div id="stage"><iframe id="frame" title="mirror"></iframe><div id="fx"></div></div>
<div id="cursor"><i></i></div>
<div id="status">
  <div class="ring"></div>
  <h1 id="st-title">Waiting for the tracker…</h1>
  <p id="st-sub">Open your tracker page (with tracker-broadcast.js added) in the same browser, or point both at the same relay.</p>
</div>

<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var ROOM = Q.get('room') || 'tracker';
  var WS = Q.get('ws') || '';
  var FIT = Q.get('fit') || 'contain';              // contain | width
  var IDLE = parseFloat(Q.get('idle') || '0');      // hide dot after N idle seconds (0 = never)
  var root = document.documentElement.style;
  if (Q.get('dot')) root.setProperty('--dot-color', Q.get('dot').charAt(0) === '#' ? Q.get('dot') : '#' + Q.get('dot'));
  if (Q.get('size')) root.setProperty('--dot', parseFloat(Q.get('size')) + 'px');
  if (Q.get('bg')) { var bg = Q.get('bg'); if (bg === 'transparent') { root.setProperty('--letterbox', 'transparent'); } else root.setProperty('--letterbox', bg.charAt(0) === '#' ? bg : '#' + bg); }
  if (Q.get('ui') === '0') document.body.classList.add('noui');

  var stage = document.getElementById('stage'), frame = document.getElementById('frame');
  var fx = document.getElementById('fx'), cursor = document.getElementById('cursor');
  var status = document.getElementById('status');
  var vw = 1920, vh = 1080, scale = 1, ox = 0, oy = 0;
  var ready = false, pending = null, doc = null;
  var hoverPath = null, isDown = false;
  var cx = 0, cy = 0, tx = 0, ty = 0, haveMouse = false, idleTimer = 0, lastMsg = 0, gotSnap = false;
  var cssCache = new Map();

  /* ---------- iframe ---------- */
  frame.srcdoc = '<!doctype html><html><head></head><body></body></html>';
  frame.addEventListener('load', function () {
    doc = frame.contentDocument; ready = true;
    if (pending) { var m = pending; pending = null; onSnap(m); }
  });

  /* ---------- layout ---------- */
  function layout() {
    var W = innerWidth, H = innerHeight;
    scale = FIT === 'width' ? W / vw : Math.min(W / vw, H / vh);
    ox = (W - vw * scale) / 2; oy = FIT === 'width' ? 0 : (H - vh * scale) / 2;
    stage.style.width = vw + 'px'; stage.style.height = vh + 'px';
    stage.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + scale + ')';
  }
  addEventListener('resize', layout);

  /* ---------- CSS handling: make :hover / :active driven by classes ---------- */
  function rewrite(css, href) {
    css = css.replace(/:hover/g, '.bc-hover').replace(/:active/g, '.bc-active');
    if (href) css = css.replace(/url\((['"]?)(?!data:|https?:|\/\/|#)([^'")]+)\1\)/g, function (m, q, rel) {
      try { return 'url("' + new URL(rel, href).href + '")'; } catch (e) { return m; }
    });
    return css;
  }
  function getCSS(href) {
    if (!cssCache.has(href)) cssCache.set(href, fetch(href).then(function (r) { if (!r.ok) throw 0; return r.text(); }));
    return cssCache.get(href);
  }
  var headToken = 0;
  async function buildHead(items, base) {
    var token = ++headToken, nodes = [];
    var b = doc.createElement('base'); b.href = base; nodes.push(b);
    for (var i = 0; i < items.length; i++) {
      var it = items[i], el;
      if (it.css != null) { el = doc.createElement('style'); el.textContent = rewrite(it.css); }
      else {
        try { var css = await getCSS(it.href); el = doc.createElement('style'); el.textContent = rewrite(css, it.href); }
        catch (e) { cssCache.delete(it.href); el = doc.createElement('link'); el.rel = 'stylesheet'; el.href = it.href; }
      }
      nodes.push(el);
    }
    if (token === headToken) doc.head.replaceChildren.apply(doc.head, nodes);
  }

  /* ---------- snapshot ---------- */
  function setAttrs(el, attrs) {
    Array.prototype.slice.call(el.attributes).forEach(function (a) { if (!(a.name in attrs)) el.removeAttribute(a.name); });
    for (var k in attrs) { if (el.getAttribute(k) !== attrs[k]) el.setAttribute(k, attrs[k]); }
  }
  function nodeAt(path) {
    var el = doc.body;
    for (var i = 0; i < path.length && el; i++) el = el.children[path[i]];
    return el || null;
  }
  function applyHover() {
    if (!doc) return;
    doc.querySelectorAll('.bc-hover,.bc-active').forEach(function (e) { e.classList.remove('bc-hover', 'bc-active'); });
    if (!hoverPath) return;
    var el = doc.body;
    function mark(e) { e.classList.add('bc-hover'); if (isDown) e.classList.add('bc-active'); }
    mark(el);
    for (var i = 0; i < hoverPath.length; i++) { el = el && el.children[hoverPath[i]]; if (!el) break; mark(el); }
  }
  function onSnap(m) {
    if (!ready) { pending = m; return; }
    vw = m.vw; vh = m.vh; layout();
    if (m.head) buildHead(m.head, m.base);
    setAttrs(doc.documentElement, m.htmlAttrs);
    setAttrs(doc.body, m.bodyAttrs);
    doc.body.innerHTML = m.body;
    doc.body.querySelectorAll('[data-bc-s]').forEach(function (e) {
      var p = e.getAttribute('data-bc-s').split(','); e.scrollTop = +p[0]; e.scrollLeft = +p[1];
    });
    if (m.ds) frame.contentWindow.scrollTo(m.ds[0], m.ds[1]);
    stage.style.background = m.bg && m.bg !== 'rgba(0, 0, 0, 0)' ? m.bg : '#fff';
    applyHover();
    if (!gotSnap) { gotSnap = true; stage.style.visibility = 'visible'; }
  }

  /* ---------- cursor ---------- */
  function wakeCursor() {
    cursor.classList.add('show');
    if (IDLE > 0) { clearTimeout(idleTimer); idleTimer = setTimeout(function () { cursor.classList.remove('show'); }, IDLE * 1000); }
  }
  function loop() {
    cx += (tx - cx) * 0.55; cy += (ty - cy) * 0.55;
    cursor.style.transform = 'translate(' + (ox + cx * scale).toFixed(1) + 'px,' + (oy + cy * scale).toFixed(1) + 'px)';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function ripple(x, y, button) {
    var r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px'; r.style.top = y + 'px';
    r.style.setProperty('--rc', button === 2 ? '#5cc8ff' : button === 1 ? '#ffd23d' : '#ffffff');
    fx.appendChild(r);
    setTimeout(function () { r.remove(); }, 650);
  }
  // ripple lives inside the stage (scales with it); keep it visually constant-size
  fx.style.pointerEvents = 'none';

  /* ---------- messages ---------- */
  function onMsg(m) {
    if (!m || !m.t) return;
    lastMsg = Date.now(); setLive(true);
    switch (m.t) {
      case 'snap': onSnap(m); break;
      case 'hb': if (m.vw && (m.vw !== vw || m.vh !== vh)) { vw = m.vw; vh = m.vh; layout(); } break;
      case 'm':
        if (m.out) { cursor.classList.remove('show'); break; }
        tx = m.x; ty = m.y;
        if (!haveMouse) { cx = tx; cy = ty; haveMouse = true; }
        if (!!m.d !== isDown) { isDown = !!m.d; cursor.classList.toggle('down', isDown); applyHover(); }
        wakeCursor(); break;
      case 'h': hoverPath = m.p; applyHover(); break;
      case 'c': ripple(m.x, m.y, m.b); break;
      case 's':
        if (!doc) break;
        if (m.p === null) frame.contentWindow.scrollTo(m.left, m.top);
        else { var el = nodeAt(m.p); if (el) { el.scrollTop = m.top; el.scrollLeft = m.left; } }
        break;
    }
  }

  /* ---------- status overlay ---------- */
  function setLive(on) {
    status.classList.toggle('hide', on);
    if (!on) {
      document.getElementById('st-title').textContent = gotSnap ? 'Tracker disconnected' : 'Waiting for the tracker…';
    }
  }
  setInterval(function () { if (Date.now() - lastMsg > 6000) setLive(false); }, 1500);

  /* ---------- transport ---------- */
  var channel = new BroadcastChannel('tracker-mirror:' + ROOM);
  var ws = null;
  function hello() {
    channel.postMessage({ t: 'hello' });
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'hello' }));
  }
  channel.onmessage = function (e) { onMsg(e.data); };
  function connectWS() {
    if (!WS) return;
    try { var u = new URL(WS); u.searchParams.set('room', ROOM); ws = new WebSocket(u.href); } catch (e) { return; }
    ws.onopen = hello;
    ws.onmessage = function (e) { try { onMsg(JSON.parse(e.data)); } catch (x) {} };
    ws.onclose = function () { setTimeout(connectWS, 2000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connectWS(); layout(); hello();
  setInterval(function () { if (!gotSnap) hello(); }, 2000);
})();
</script>
</body>
</html>
