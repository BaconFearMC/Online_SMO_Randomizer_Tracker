<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamer's Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #17306b; --sky1: #4fc3ff; --sky2: #c7f0ff; --sun: #ffd23d; --red: #ff3b4f; --dot: 18px; --dot-color: #ff3b4f;
          --font: "Lilita One", "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: var(--navy); }
  body { background: transparent; }
  body.solid { background: #0f2250; }

  /* square shell: the viewer is ALWAYS 1:1 */
  #shell { position: absolute; left: 50%; top: 50%; width: min(100vw, 100vh); height: min(100vw, 100vh); transform: translate(-50%, -50%); padding: 2.2%; }
  #frame { position: relative; width: 100%; height: 100%; border-radius: 28px; border: 6px solid var(--navy); overflow: hidden;
    box-shadow: 0 0 0 4px #fff, 0 10px 30px rgba(0,0,0,.4);
    background:
      radial-gradient(circle at 12% 18%, #fff 0 6%, transparent 6.5%), radial-gradient(circle at 19% 20%, #fff 0 8%, transparent 8.5%), radial-gradient(circle at 27% 18%, #fff 0 5%, transparent 5.5%),
      radial-gradient(circle at 80% 70%, #fff 0 6%, transparent 6.5%), radial-gradient(circle at 87% 72%, #fff 0 8%, transparent 8.5%), radial-gradient(circle at 94% 70%, #fff 0 5%, transparent 5.5%),
      linear-gradient(180deg, var(--sky1), var(--sky2)); }
  #frame::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 14px, transparent 14px 28px); pointer-events: none; }

  /* HUD */
  #hud { position: absolute; left: 3%; right: 3%; top: 2.5%; height: 9%; display: flex; align-items: center; gap: 2.5%; z-index: 4; }
  #moon { width: 8%; aspect-ratio: 1; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff7a8, var(--sun) 60%, #f5a300); border: 4px solid var(--navy);
    display: grid; place-items: center; box-shadow: 0 4px 0 var(--navy); animation: bob 2.4s ease-in-out infinite; }
  #moon svg { width: 62%; height: 62%; }
  #ribbon { position: relative; padding: .55em 1.4em; border-radius: 14px; background: #fff; border: 4px solid var(--navy); box-shadow: 0 4px 0 var(--navy);
    font-size: clamp(14px, 3.3vw, 30px); line-height: 1; letter-spacing: .03em; text-transform: uppercase; transform: rotate(-1.5deg); white-space: nowrap; }
  #live { margin-left: auto; display: flex; align-items: center; gap: .45em; padding: .5em 1em; border-radius: 999px; background: var(--red); color: #fff; border: 4px solid var(--navy);
    box-shadow: 0 4px 0 var(--navy); font-size: clamp(12px, 2.6vw, 24px); line-height: 1; letter-spacing: .08em; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #live i { width: .7em; height: .7em; border-radius: 50%; background: #fff; animation: blink 1s steps(2) infinite; }
  #live.off { background: #8892b0; } #live.off i { animation: none; opacity: .6; }

  /* board = the simplified "screen" */
  #board { position: absolute; left: 3%; right: 3%; top: 14%; bottom: 13%; border-radius: 20px; background: rgba(255,255,255,.4); border: 4px dashed rgba(23,48,107,.45); z-index: 2; }
  #tiles { position: absolute; inset: 0; transition: opacity .25s, transform .25s; }
  #board.marking #tiles { opacity: 0; transform: scale(.96); }

  .kc { position: absolute; border-radius: 16px; background: color-mix(in srgb, var(--c) 16%, #fff); border: 4px solid var(--navy); box-shadow: 0 5px 0 rgba(23,48,107,.55); transition: transform .12s, box-shadow .12s; }
  .kc.hv { transform: translateY(-3px); box-shadow: 0 9px 0 rgba(23,48,107,.55), 0 0 0 4px var(--sun); z-index: 3; }
  .kh { position: absolute; left: -4px; right: -4px; top: -4px; height: 24px; max-height: 20%; padding: 0 .6em; display: flex; align-items: center; justify-content: center;
    border-radius: 14px 14px 8px 8px; background: var(--c); border: 4px solid var(--navy); color: #fff; font-size: 14px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-text-stroke: 0; text-shadow: 0 2px 0 rgba(0,0,0,.45), 1.5px 0 0 rgba(0,0,0,.35), -1.5px 0 0 rgba(0,0,0,.35); }
  .row { position: absolute; display: flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 9px; background: #fff; border: 2.5px solid var(--navy); overflow: hidden; z-index: 1;
    transition: transform .12s, background .12s; }
  .row .rn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 rgba(0,0,0,.12); }
  .row img { height: 78%; width: auto; max-height: 24px; object-fit: contain; flex: none; filter: drop-shadow(0 1px 0 rgba(0,0,0,.3)); }
  .row.done { background: #d8ffcc; }
  .row.done::after { content: "\2605"; color: #f5a300; text-shadow: 0 1px 0 var(--navy); margin-left: 2px; font-size: 1.1em; }
  .row.hv { background: #fff6b0; transform: scale(1.06); z-index: 4; box-shadow: 0 0 0 3px var(--sun), 0 5px 0 rgba(23,48,107,.5); }

  /* looking-at bubble */
  #look { position: absolute; left: 4%; bottom: 3%; max-width: 62%; display: flex; flex-direction: column; gap: 2px; padding: .5em 1.1em .55em; border-radius: 18px 18px 18px 4px;
    background: var(--sun); border: 4px solid var(--navy); box-shadow: 0 4px 0 var(--navy); font-size: clamp(14px, 3vw, 28px); line-height: 1.05; z-index: 5;
    transform: translateY(8px) scale(.9); opacity: 0; transform-origin: left bottom; transition: .18s; }
  #look.show { transform: none; opacity: 1; }
  #look small { font-size: .5em; letter-spacing: .16em; text-transform: uppercase; opacity: .65; }
  #look span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #look em { font-style: normal; font-size: .62em; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* click toast */
  #toast { position: absolute; right: 4%; bottom: 3%; max-width: 52%; padding: .5em 1.1em; border-radius: 18px 18px 4px 18px; background: #fff; border: 4px solid var(--navy); box-shadow: 0 4px 0 var(--navy);
    font-size: clamp(14px, 3vw, 28px); line-height: 1.05; z-index: 6; opacity: 0; transform: scale(.6) rotate(4deg); transform-origin: right bottom; pointer-events: none; }
  #toast.show { animation: pop .4s cubic-bezier(.3,1.6,.5,1) forwards; }
  #toast small { display: block; font-size: .5em; letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
  #toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

  /* cursor + click burst (inside #board) */
  #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .3s; will-change: transform; pointer-events: none; z-index: 20; }
  #cursor.show { opacity: 1; }
  #cursor i { position: absolute; left: calc(var(--dot) / -2); top: calc(var(--dot) / -2); width: var(--dot); height: var(--dot); border-radius: 50%;
    background: var(--dot-color); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--navy), 0 3px 0 2px var(--navy); transition: transform .09s; }
  #cursor.down i { transform: scale(.68, .58); }
  #board.marking #cursor { opacity: 0 !important; }
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 19; overflow: visible; }
  .ring { position: absolute; width: var(--dot); height: var(--dot); margin: calc(var(--dot) / -2) 0 0 calc(var(--dot) / -2); border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 2px var(--navy);
    animation: ring .5s ease-out forwards; }
  .spark { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: var(--sun); border: 2px solid var(--navy); border-radius: 3px; rotate: 45deg;
    animation: spark .55s ease-out forwards; }
  body.rc .ring { border-color: #8be0ff; } 

  /* "Marking X" card */
  #mark { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #board.marking #mark { opacity: 1; }
  #mcard { width: 78%; padding: 7% 6% 6%; text-align: center; border-radius: 28px; background: #fff; border: 6px solid var(--navy); box-shadow: 0 8px 0 var(--navy), 0 0 0 6px var(--sun);
    transform: scale(.7) rotate(-3deg); transition: transform .35s cubic-bezier(.3,1.6,.5,1); position: relative; }
  #board.marking #mcard { transform: rotate(-1.5deg); }
  #mbadge { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%) rotate(2deg); padding: .35em 1.2em; border-radius: 999px; background: var(--red); color: #fff; border: 4px solid var(--navy);
    box-shadow: 0 4px 0 var(--navy); font-size: clamp(14px, 3vw, 26px); letter-spacing: .12em; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  #mpen { width: 18%; margin: 0 auto 3%; animation: wiggle .9s ease-in-out infinite; transform-origin: 20% 90%; }
  #mname { font-size: clamp(26px, 8.5vw, 80px); line-height: 1.02; word-break: break-word; }
  #mking { display: inline-block; margin-top: 3%; padding: .25em 1em; border-radius: 999px; background: var(--sun); border: 4px solid var(--navy); font-size: clamp(13px, 3vw, 26px); }
  #mking:empty { display: none; }
  .star { position: absolute; width: 7%; aspect-ratio: 1; background: var(--sun); border: 3px solid var(--navy); clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); animation: twinkle 1.4s ease-in-out infinite; }

  /* waiting */
  #status { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2%; text-align: center;
    background: linear-gradient(180deg, rgba(79,195,255,.96), rgba(199,240,255,.97)); transition: opacity .35s; }
  #status.hide { opacity: 0; pointer-events: none; }
  #status .big { width: 22%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff7a8, var(--sun) 60%, #f5a300); border: 5px solid var(--navy); box-shadow: 0 6px 0 var(--navy); animation: bounce 1s ease-in-out infinite; }
  #status h1 { margin: 0; font-weight: 400; font-size: clamp(20px, 5.5vw, 48px); }
  #status p { margin: 0; font-family: "Baloo 2", system-ui, sans-serif; font-weight: 600; font-size: clamp(11px, 2.2vw, 18px); opacity: .7; max-width: 70%; }

  body.noui #hud { display: none; } body.noui #board { top: 4%; }

  @keyframes bob { 50% { transform: translateY(-4px) rotate(4deg); } }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6) rotate(4deg); } 60% { opacity: 1; transform: scale(1.08) rotate(-2deg); } 100% { opacity: 1; transform: scale(1) rotate(-1deg); } }
  @keyframes ring { from { transform: scale(.8); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
  @keyframes spark { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg) translateY(-4px); } }
  @keyframes twinkle { 50% { transform: scale(.55) rotate(25deg); opacity: .7; } }
  @keyframes bounce { 50% { transform: translateY(-14px); } }
</style>
</head>
<body class="solid">
<div id="shell"><div id="frame">
  <div id="hud">
    <div id="moon"><svg viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6 6.8 19.4l1-5.9L3.5 9.4l5.9-.8z" fill="#fff" stroke="#17306b" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    <div id="ribbon">Streamer's Screen</div>
    <div id="live" class="off"><i></i>LIVE</div>
  </div>
  <div id="board">
    <div id="tiles"></div>
    <div id="fx"></div>
    <div id="cursor"><i></i></div>
    <div id="mark">
      <div class="star" style="left:6%;top:12%"></div><div class="star" style="right:8%;top:20%;animation-delay:.4s"></div><div class="star" style="left:14%;bottom:12%;animation-delay:.8s"></div><div class="star" style="right:12%;bottom:10%;animation-delay:.2s"></div>
      <div id="mcard">
        <div id="mbadge">MARKING</div>
        <svg id="mpen" viewBox="0 0 64 64"><path d="M10 54l4-14L40 14l10 10-26 26z" fill="#ffd23d" stroke="#17306b" stroke-width="4" stroke-linejoin="round"/><path d="M40 14l6-6a4 4 0 0 1 6 0l4 4a4 4 0 0 1 0 6l-6 6z" fill="#ff3b4f" stroke="#17306b" stroke-width="4" stroke-linejoin="round"/><path d="M10 54l4-14 10 10z" fill="#fff" stroke="#17306b" stroke-width="4" stroke-linejoin="round"/></svg>
        <div id="mname"></div><div id="mking"></div>
      </div>
    </div>
  </div>
  <div id="look"><small>Looking at</small><span id="look-t"></span><em id="look-l"></em></div>
  <div id="toast"><small>Clicked</small><span id="toast-t"></span></div>
  <div id="status"><div class="big"></div><h1 id="st-title">Waiting for the streamer…</h1><p>Open the tracker's Notes page, or point both at the same relay.</p></div>
</div></div>

<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var ROOM = Q.get('room') || 'tracker', WS = Q.get('ws') || '';
  var IDLE = parseFloat(Q.get('idle') || '0');
  var root = document.documentElement.style;
  function col(v) { return v.charAt(0) === '#' ? v : '#' + v; }
  if (Q.get('dot')) root.setProperty('--dot-color', col(Q.get('dot')));
  if (Q.get('size')) root.setProperty('--dot', parseFloat(Q.get('size')) + 'px');
  if (Q.get('bg') === 'transparent') document.body.classList.remove('solid');
  if (Q.get('ui') === '0') document.body.classList.add('noui');

  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), tiles = $('tiles'), cursor = $('cursor'), fx = $('fx'), live = $('live'), status = $('status');
  var vw = 1920, vh = 1080, bw = 1, bh = 1;
  var scene = null, hk = '', hz = '', hl = '';
  var cx = 0, cy = 0, tx = 0, ty = 0, haveMouse = false, gotScene = false, lastMsg = 0, idleTimer = 0, toastTimer = 0, resizeTimer = 0;

  function measure() { bw = board.clientWidth || 1; bh = board.clientHeight || 1; }
  addEventListener('resize', function () { measure(); render(); fitWindow(); });

  // popup windows keep themselves square
  function fitWindow() {
    if (!window.opener || window.opener.closed) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var S = Math.max(Math.min(innerWidth, innerHeight), 360);
      if (Math.abs(innerWidth - S) > 2 || Math.abs(innerHeight - S) > 2) { try { resizeTo(S + (outerWidth - innerWidth), S + (outerHeight - innerHeight)); } catch (e) {} }
    }, 250);
  }

  /* ---------- draw the simplified scene ---------- */
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function place(e, r) {
    e.style.left = (r[0] * 100) + '%'; e.style.top = (r[1] * 100) + '%'; e.style.width = (r[2] * 100) + '%'; e.style.height = (r[3] * 100) + '%';
  }
  function darken(c) {   // make kingdom colors readable on white
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || '');
    if (!m) return '#17306b';
    var f = 0.62; return 'rgb(' + Math.round(m[1] * f) + ',' + Math.round(m[2] * f) + ',' + Math.round(m[3] * f) + ')';
  }
  function render() {
    tiles.textContent = '';
    if (!scene) return;
    scene.cols.forEach(function (c) {
      var d = el('div', 'kc'); place(d, c.r); d.dataset.k = c.k; d.style.setProperty('--c', c.c || '#4d96ff');
      var h = el('div', 'kh'); h.textContent = c.n; d.appendChild(h);
      tiles.appendChild(d);
      c.rows.forEach(function (r) {
        var row = el('div', 'row' + (r.d ? ' done' : '')); place(row, r.r); row.dataset.k = c.k; row.dataset.z = r.n;
        var hpx = r.r[3] * bh, fs = Math.max(8, Math.min(15, hpx * 0.56));
        row.style.fontSize = fs + 'px'; row.style.color = darken(r.c);
        if (hpx < 10) row.style.borderWidth = '1.5px';
        var n = el('span', 'rn'); n.textContent = hpx < 9 ? '' : r.n; row.appendChild(n);
        (r.i || []).forEach(function (s) { var im = el('img'); im.src = s; im.alt = ''; row.appendChild(im); });
        tiles.appendChild(row);
      });
    });
    var mk = scene.mark;
    board.classList.toggle('marking', !!mk);
    if (mk) { $('mname').textContent = mk.z || (mk.p ? 'a painting' : 'something'); $('mking').textContent = mk.z && mk.k && mk.k !== mk.z ? mk.k : ''; }
    applyHover();
  }
  function applyHover() {
    tiles.querySelectorAll('.hv').forEach(function (e) { e.classList.remove('hv'); });
    var looking = !!(hz || hk) && !(scene && scene.mark);
    if (looking) {
      var rows = tiles.querySelectorAll('.row'), hit = null;
      rows.forEach(function (e) { if (hz && e.dataset.z === hz && e.dataset.k === hk) hit = e; });
      if (hit) hit.classList.add('hv');
      else tiles.querySelectorAll('.kc').forEach(function (e) { if (e.dataset.k === hk && !hz) e.classList.add('hv'); });
    }
    $('look-t').textContent = hz || hk; $('look-l').textContent = hz && hl ? 'on ' + hl : (!hz && hl ? hl : '');
    $('look').classList.toggle('show', looking);
  }

  /* ---------- cursor + click effects ---------- */
  function wake() { cursor.classList.add('show'); if (IDLE > 0) { clearTimeout(idleTimer); idleTimer = setTimeout(function () { cursor.classList.remove('show'); }, IDLE * 1000); } }
  (function loop() {
    cx += (tx - cx) * 0.55; cy += (ty - cy) * 0.55;
    cursor.style.transform = 'translate(' + (cx / vw * bw).toFixed(1) + 'px,' + (cy / vh * bh).toFixed(1) + 'px)';
    requestAnimationFrame(loop);
  })();
  function burst(x, y, b) {
    var px = x / vw * bw, py = y / vh * bh;
    var r = el('div', 'ring'); r.style.left = px + 'px'; r.style.top = py + 'px';
    if (b === 2) r.style.borderColor = '#8be0ff'; fx.appendChild(r); setTimeout(function () { r.remove(); }, 600);
    for (var i = 0; i < 6; i++) {
      var s = el('div', 'spark'), a = (i / 6) * Math.PI * 2 + Math.random() * .5, dist = 26 + Math.random() * 14;
      s.style.left = px + 'px'; s.style.top = py + 'px';
      s.style.setProperty('--dx', Math.cos(a) * dist + 'px'); s.style.setProperty('--dy', Math.sin(a) * dist + 'px');
      fx.appendChild(s); (function (n) { setTimeout(function () { n.remove(); }, 650); })(s);
    }
  }
  function toast(m) {
    var t = m.z || m.l || m.k; if (!t || (scene && scene.mark)) return;
    $('toast-t').textContent = t + (m.z && m.l ? ' \u2022 ' + m.l : '');
    var e = $('toast'); e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { e.classList.remove('show'); e.style.opacity = 0; }, 1900);
  }

  /* ---------- messages ---------- */
  function onMsg(m) {
    if (!m || !m.t) return;
    lastMsg = Date.now(); setLive(true);
    switch (m.t) {
      case 'scene': vw = m.vw || vw; vh = m.vh || vh; scene = m; gotScene = true; render(); break;
      case 'hb': if (m.vw) { vw = m.vw; vh = m.vh; } break;
      case 'm':
        if (m.vw) { vw = m.vw; vh = m.vh; }
        if (m.out) { cursor.classList.remove('show'); break; }
        tx = m.x; ty = m.y; if (!haveMouse) { cx = tx; cy = ty; haveMouse = true; }
        cursor.classList.toggle('down', !!m.d); wake(); break;
      case 'h': hk = m.k || ''; hz = m.z || ''; hl = m.l || ''; applyHover(); break;
      case 'c': burst(m.x, m.y, m.b); toast(m); break;
    }
  }
  function setLive(on) {
    status.classList.toggle('hide', on); live.classList.toggle('off', !on);
    if (!on) $('st-title').textContent = gotScene ? 'Streamer stepped away' : 'Waiting for the streamer…';
  }
  setInterval(function () { if (Date.now() - lastMsg > 6000) setLive(false); }, 1500);

  /* ---------- transport ---------- */
  var channel = new BroadcastChannel('tracker-mirror:' + ROOM), ws = null;
  function hello() { channel.postMessage({ t: 'hello' }); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'hello' })); }
  channel.onmessage = function (e) { onMsg(e.data); };
  function connectWS() {
    if (!WS) return;
    try { var u = new URL(WS); u.searchParams.set('room', ROOM); ws = new WebSocket(u.href); } catch (e) { return; }
    ws.onopen = hello;
    ws.onmessage = function (e) { try { onMsg(JSON.parse(e.data)); } catch (x) {} };
    ws.onclose = function () { setTimeout(connectWS, 2000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  measure(); connectWS(); hello(); fitWindow();
  setInterval(function () { if (!gotScene) hello(); }, 2000);
})();
</script>
</body>
</html>
